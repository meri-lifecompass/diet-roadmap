<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ダイエットロードマップ診断</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg"></div>
  <main class="app">
    <section id="startScreen" class="screen active">
      <div class="card hero-card">
        <p class="eyebrow">購入者様限定特典</p>
        <h1>あなた専用<br><span>ダイエットロードマップ診断</span></h1>
        <p class="lead">今のあなたに必要な優先順位を見つけて、無理なく続けられるダイエットの道筋をつくります。</p>
        <div class="mini-grid">
          <div><strong>現在地</strong><span>減量期 / ボディメイク期 / 維持期</span></div>
          <div><strong>優先順位</strong><span>1位・2位・3位を表示</span></div>
          <div><strong>ロードマップ</strong><span>90日で何から始めるか</span></div>
        </div>
        <button class="btn primary" id="startBtn">診断をはじめる</button>
        <p class="caption">所要時間：約3〜5分</p>
      </div>
    </section>
    <section id="quizScreen" class="screen">
      <div class="card">
        <div class="topbar"><button class="text-btn" id="backBtn">← 戻る</button><span id="progressText"></span></div>
        <div class="progress"><div id="progressBar"></div></div>
        <h2 id="questionTitle"></h2>
        <p id="questionHelp" class="question-help"></p>
        <div id="answerArea" class="answers"></div>
        <button class="btn primary wide" id="nextBtn">次へ</button>
      </div>
    </section>
    <section id="resultScreen" class="screen">
      <div class="card result-card">
        <p class="eyebrow">診断結果</p>
        <h2>あなた専用<br><span>ダイエットロードマップ</span></h2>
        <div id="resultArea"></div>
        <div class="result-actions">
          <button class="btn primary" id="printBtn">PDF保存・印刷する</button>
          <button class="btn secondary" id="retryBtn">もう一度診断する</button>
        </div>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
