<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>あなた専用ダイエットロードマップ診断</title>
<style>
:root{--p:#d9798b;--p2:#b95670;--g:#c8a46a;--b:#3d2a1d;--m:#876f60;--l:#ead7c8;--ps:#fff0f3;--gs:#f7edda}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--b);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",YuGothic,"Noto Sans JP",Meiryo,sans-serif;line-height:1.8;background:radial-gradient(circle at 8% 0%,#ffe0db,transparent 27%),radial-gradient(circle at 95% 8%,#f4e0bd,transparent 25%),linear-gradient(135deg,#fffefa,#fff6ef 52%,#fffaf7)}
.wrap{width:min(920px,92vw);margin:auto;padding:26px 0 60px}
.hero,.panel{background:rgba(255,255,255,.94);border:1px solid var(--l);border-radius:30px;box-shadow:0 18px 46px rgba(99,65,39,.13);overflow:hidden}
.hero{text-align:center;padding:38px 22px}.panel{margin-top:24px;padding:26px}
h1,h2,h3{font-family:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;letter-spacing:.04em;line-height:1.45;margin:0}
h1{font-size:clamp(31px,6vw,58px);margin:16px 0 10px}h1 span,.pink{color:var(--p)}h2{font-size:clamp(22px,3.4vw,34px)}h3{font-size:clamp(18px,2.4vw,25px)}
.badge{display:inline-block;padding:7px 16px;border-radius:999px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-weight:900;letter-spacing:.1em;font-size:13px}
.lead{max-width:760px;margin:0 auto;color:var(--m)}.note{max-width:820px;margin:18px auto 0;text-align:left;padding:13px 16px;border-radius:18px;background:#fff7f8;border:1px solid #f0cfd5;color:#6e5044;font-size:14px}
.progress-wrap{margin:20px auto 0;max-width:760px}.progress-text{display:flex;justify-content:space-between;font-size:13px;color:var(--m);font-weight:900;margin-bottom:8px}.progress-bar{height:9px;border-radius:999px;background:#f2dfe4;overflow:hidden}.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--p),var(--g));border-radius:999px;transition:.25s}
.step-card{max-width:680px;margin:0 auto;text-align:center}
.step-label{color:var(--m);font-weight:900;font-size:13px;letter-spacing:.06em;margin-bottom:10px}
.step-title{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:clamp(25px,5vw,42px);font-weight:900;line-height:1.55;margin:10px auto 18px;word-break:keep-all;overflow-wrap:break-word}
.step-sub{color:var(--m);font-size:14px;margin:-6px 0 18px}
.input-wrap{position:relative;max-width:360px;margin:0 auto}.input-wrap input{padding-right:58px}.unit{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-weight:900}
input,select{width:100%;min-width:0;padding:15px 14px;border:1px solid #e9d4c5;border-radius:18px;background:#fff;color:var(--b);font-size:20px;text-align:center}
.select-wrap{max-width:520px;margin:0 auto}
.choices{display:grid;gap:10px;max-width:560px;margin:0 auto}
.choice{width:100%;min-height:62px;padding:14px 16px;border:1px solid #f2ddd6;border-radius:18px;background:#fffaf8;color:#5d4435;cursor:pointer;font-weight:900;font-size:16px;text-align:left;display:flex;align-items:center;gap:12px;appearance:none;-webkit-appearance:none}
.choice:before{content:"";width:22px;height:22px;border:2px solid #d8b9ac;border-radius:50%;background:#fff;flex:0 0 auto}
.choice:hover,.choice.selected{border-color:#e8aeb9;background:#fff4f6}.choice.selected:before{background:radial-gradient(circle,var(--p) 0 45%,#fff 48%);border-color:var(--p)}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px;justify-content:center}button{border:0;border-radius:999px;padding:14px 22px;font-weight:900;font-size:15px;cursor:pointer}
.primary{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}.secondary{background:#fff;color:var(--b);border:1px solid var(--l)}.hidden{display:none!important}
.loader{padding:34px;text-align:center}.loader-bar{height:10px;background:#f2dfe4;border-radius:999px;overflow:hidden;margin:20px auto;max-width:420px}.loader-fill{height:100%;width:0;background:linear-gradient(90deg,var(--p),var(--g));animation:loading 2.2s forwards;border-radius:999px}@keyframes loading{to{width:100%}}
.result-cover,.result-hero{text-align:center;padding:30px 18px;border-radius:26px;border:1px solid #efd0d6;background:#fff}.result-cover{margin-bottom:22px;background:linear-gradient(135deg,#fffdf9,#fff6ef)}
.result-cover-title,.type-name{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;color:var(--p);font-weight:900}.result-cover-title{font-size:clamp(26px,5vw,46px);line-height:1.45;margin:8px 0;color:var(--b)}.result-cover-title span{color:var(--p)}.type-name{font-size:clamp(28px,5vw,48px);margin:6px 0}
.grid{display:grid;gap:14px}@media(min-width:760px){.grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card,.rank-card,.month,.todo,.cta-box{background:#fff;border:1px solid var(--l);border-radius:22px;padding:17px}.rank-card{display:grid;gap:8px}.rank{display:inline-block;width:max-content;padding:4px 12px;border-radius:999px;background:var(--ps);color:var(--p2);font-weight:900}
.score,.small{color:var(--m);font-size:13px}.stars{color:var(--g);letter-spacing:.08em;font-weight:900}.meter,.bar{background:#f1e3db;border-radius:999px;overflow:hidden}.meter{height:8px}.bar{height:11px}.meter span,.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--g));border-radius:999px}
.section-title{display:flex;gap:10px;align-items:center;margin-bottom:16px}.num{min-width:40px;height:40px;border-radius:999px;display:grid;place-items:center;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-weight:900}
.priority-list{display:grid;gap:10px}.priority-item{display:flex;gap:10px;align-items:center;padding:13px;border:1px solid var(--l);background:#fff7f1;border-radius:16px;font-weight:900}
.roadmap{display:grid;gap:14px}@media(min-width:760px){.roadmap{grid-template-columns:repeat(3,1fr)}}.month h3{color:var(--p);margin-bottom:8px}ul.clean{padding-left:1.2em;margin:8px 0}
.evidence{background:#fffaf8;border-left:4px solid var(--g);padding:14px 16px;border-radius:14px;color:#684f40;font-size:14px}.pill-list{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}.pill{background:var(--gs);border:1px solid #ead5ae;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:900}
.radar{display:grid;gap:10px}.radar-row{display:grid;grid-template-columns:130px 1fr 46px;gap:10px;align-items:center;font-size:14px}.todo,.cta-box{background:#fff7f8;border-color:#f0cfd5}.cta-box{text-align:center;margin-top:22px}.cta-box h2{color:var(--p)}
footer{text-align:center;color:var(--m);font-size:12px;margin-top:24px}
@media(max-width:759px){.wrap{width:94vw;padding:18px 0 46px}.hero,.panel{padding:18px}h1{font-size:32px}.step-title{font-size:26px;text-align:left}.choice{font-size:15px}.grid.cols-3,.roadmap{grid-template-columns:1fr}.radar-row{grid-template-columns:1fr;gap:5px}button{width:100%;max-width:340px}}
@media print{@page{size:A4;margin:12mm}body{background:#fff!important}body *{visibility:hidden!important}#results,#results *{visibility:visible!important}#results{position:absolute!important;left:0;top:0;width:100%!important;box-shadow:none!important;border:0!important;background:#fff!important;padding:0!important}.no-print{display:none!important}.result-cover{break-after:page}.result-block,.rank-card,.month,.card,.todo,.evidence,.cta-box{break-inside:avoid}}
</style>
</head>
<body>
<main class="wrap">
<header class="hero no-print">
<span class="badge">購入者限定特典</span>
<h1>あなた専用<br><span>ダイエットロードマップ診断</span></h1>
<p class="lead">1問ずつ答えるだけで、今のあなたに必要な「痩せない原因」「改善の優先順位」「90日ロードマップ」が分かります。</p>
<div class="note">※この診断は一般的な健康・ダイエット知識をもとにしたセルフチェックです。医療的な診断・治療を目的とするものではありません。</div>
<div class="progress-wrap"><div class="progress-text"><span id="progressLabel"></span><span id="progressPercent"></span></div><div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div></div>
</header>

<section class="panel no-print" id="app"></section>
<section class="panel hidden" id="results"></section>
<footer>© ダイエット卒業の教科書</footer>
</main>

<script>
const cats={
food:{label:"食事バランス",icon:"🍽️",causeTitle:"食事の内容・量が整っていない",causeText:"摂取カロリーや栄養バランスが安定していないと、体脂肪が落ちにくくなります。",priority:"食事を整える",action:"主食・タンパク質・野菜をそろえ、間食や飲み物も記録する",todo:"今日食べたものを、飲み物・間食まで含めて記録する",chapter:"第3章「痩せる食事」",advice:"食事を大きく減らす前に、まずは内容を見える化しましょう。タンパク質・野菜・主食のバランスを整えることで、我慢ではなく続けられる食事に近づきます。"},
activity:{label:"活動量不足",icon:"🚶",causeTitle:"日常の消費カロリーが少ない",causeText:"座り時間が長く歩数が少ないと、消費カロリーが不足しやすくなります。",priority:"日常の活動量を増やす",action:"今より+1,000〜2,000歩を目安に増やす",todo:"今日の歩数を確認して、明日は+1,000歩を目標にする",chapter:"第4章「痩せる運動と生活習慣」",advice:"食事をさらに減らす前に、日常の動きを増やすことが優先です。歩数・階段・家事など小さな活動を増やすだけでも、消費カロリーの底上げにつながります。"},
sleep:{label:"睡眠・生活リズム",icon:"🌙",causeTitle:"睡眠不足で食欲や行動が乱れやすい",causeText:"睡眠不足は食欲・間食・疲労感に影響し、食事管理や活動量アップを難しくします。",priority:"睡眠と生活リズムを整える",action:"起床時間をそろえ、寝る前のスマホ時間を減らす",todo:"今夜の寝る時間を決めて、寝る30分前はスマホを閉じる",chapter:"第4章「痩せる運動と生活習慣」",advice:"睡眠が乱れると、食欲や疲労感に影響しやすくなります。まずは起床時間をそろえ、寝る前のスマホや夜更かしを少しずつ減らしていきましょう。"},
stress:{label:"ストレス・メンタル",icon:"💭",causeTitle:"ストレスで食欲や継続力が乱れやすい",causeText:"我慢が続くと反動で食べやすくなり、ダイエットが短期集中で終わりやすくなります。",priority:"ストレス対策を作る",action:"食べる以外のリセット方法を3つ用意する",todo:"食べる以外のリセット方法を1つ決める",chapter:"第5章「リバウンドしない思考」",advice:"完璧にやろうとすると、できなかった日の反動が大きくなります。食べる以外のストレス解消法を持ち、70点でも続けることを目指しましょう。"},
restriction:{label:"過去の極端な食事制限",icon:"⚠️",causeTitle:"食事制限の反動が起きやすい",causeText:"極端な制限を繰り返すと、活動量低下や反動食いにつながり、長期的に続きにくくなります。",priority:"食べながら整える",action:"摂取カロリーを下げすぎず、まずは記録して現状を把握する",todo:"食事を減らす前に、現状把握シートに今の食事量を書く",chapter:"第1章「ダイエットの大原則」",advice:"過去に極端な食事制限を繰り返してきた人ほど、さらに減らすより整えることが大切です。まずは適切な摂取量を知り、食べながら体を戻していきましょう。"},
muscle:{label:"筋力・体づくり不足",icon:"💪",causeTitle:"見た目を変える土台が不足している",causeText:"体重だけを落としても、筋肉量が少ないと引き締まりにくく、理想の見た目に近づきにくいことがあります。",priority:"筋トレを取り入れる",action:"週2回、下半身・背中・お尻を中心に軽い筋トレを始める",todo:"スクワット・ヒップリフトなど下半身トレを1種目だけ試す",chapter:"第4章「痩せる運動と生活習慣」",advice:"見た目を変えたいなら、体重だけでなく筋肉を維持することも大切です。下半身・背中・お尻を中心に、無理のない筋トレを取り入れていきましょう。"}
};
const questions=[
["食事記録をしても、間食・飲み物・調味料を入れ忘れることが多い","food","食事・活動量","🍽️"],["タンパク質や野菜が不足していると感じる","food","食事・活動量","🍽️"],["忙しい日は、パン・麺・お菓子だけで済ませることがある","food","食事・活動量","🍽️"],["外食やコンビニで何を選べばいいか分からない","food","食事・活動量","🍽️"],["運動しない日の歩数が少ない、または座っている時間が長い","activity","食事・活動量","🚶"],["移動は車・エレベーター中心で、日常であまり動かない","activity","食事・活動量","🚶"],
["運動はしているけど、それ以外の時間はほとんど座っている","activity","活動量・睡眠","🌙"],["食事を減らしているのに、生活全体の活動量は少ない","activity","活動量・睡眠","🌙"],["睡眠時間が6時間未満の日が多い","sleep","活動量・睡眠","🌙"],["寝不足の日ほど甘いものや高カロリーなものを食べたくなる","sleep","活動量・睡眠","🌙"],["起床・就寝時間が日によって大きくバラバラ","sleep","活動量・睡眠","🌙"],["疲れていて運動や自炊を後回しにしやすい","sleep","活動量・睡眠","🌙"],
["ストレスが溜まると食べて発散しやすい","stress","ストレス・過去の制限","💭"],["体重が増えると落ち込み、極端な調整をしたくなる","stress","ストレス・過去の制限","💭"],["完璧にできないと、もういいやと投げ出しやすい","stress","ストレス・過去の制限","💭"],["毎日体重に一喜一憂して、気持ちが左右されやすい","stress","ストレス・過去の制限","💭"],["過去に糖質制限・断食・置き換えなどを短期間で頑張ったことがある","restriction","ストレス・過去の制限","⚠️"],["食べる量を減らして痩せても、反動で戻った経験がある","restriction","ストレス・過去の制限","⚠️"],
["今も「もっと食べる量を減らさないと」と思いやすい","restriction","食事制限・体づくり","💪"],["ダイエット中は外食やお菓子に罪悪感を持ちやすい","restriction","食事制限・体づくり","💪"],["筋トレより有酸素や食事制限を優先しがち","muscle","食事制限・体づくり","💪"],["体重は落ちても、見た目が思うように変わらなかった経験がある","muscle","食事制限・体づくり","💪"],["お尻・背中・脚などの筋トレ習慣がほとんどない","muscle","食事制限・体づくり","💪"],["引き締めたいけど、何から筋トレすればいいか分からない","muscle","食事制限・体づくり","💪"]
].map(([text,cat,group,icon])=>({type:"choice",text,cat,group,icon,options:[["当てはまらない",0],["少し当てはまる",1],["かなり当てはまる",2]]}));
const steps=[
{type:"start",title:"診断を始めましょう",sub:"全部で約3分。1問ずつ進みます。"},
{type:"number",key:"age",title:"年齢を教えてください",unit:"歳",placeholder:"例：27"},
{type:"select",key:"sex",title:"性別を教えてください",options:[["女性","female"],["男性","male"]]},
{type:"number",key:"height",title:"身長を教えてください",unit:"cm",placeholder:"例：153"},
{type:"number",key:"weight",title:"体重を教えてください",unit:"kg",placeholder:"例：47"},
{type:"select",key:"activity",title:"普段の活動量を選んでください",options:[["かなり少ない（座りっぱなし）",1.2],["少なめ（軽い移動・家事）",1.375],["普通（週1〜3回運動）",1.55],["多い（週4回以上運動）",1.725]]},
{type:"select",key:"goal",title:"今一番叶えたいことは？",options:[["体脂肪を落としたい","fatloss"],["見た目を引き締めたい","shape"],["リバウンドせず維持したい","maintain"]]},
...questions,
{type:"loading",title:"診断結果を作成中です",sub:"あなた専用ロードマップをまとめています…"}
];
let idx=0;
let data={age:"",sex:"female",height:"",weight:"",activity:1.55,goal:"fatloss"};
let answers=Array(questions.length).fill(0);
function updateProgress(){const percent=Math.round(((idx+1)/steps.length)*100);progressLabel.textContent=`STEP ${idx+1} / ${steps.length}`;progressPercent.textContent=`${percent}%`;progressFill.style.width=`${percent}%`;}
function render(){updateProgress();const s=steps[idx];let html="";let isLastQuestion=idx===steps.length-2;
if(s.type==="start"){html=`<div class="step-card"><div class="step-label">WELCOME</div><div class="step-title">${s.title}</div><p class="step-sub">${s.sub}</p></div>`;}
if(s.type==="number"){html=`<div class="step-card"><div class="step-label">BASIC INFO</div><div class="step-title">${s.title}</div><div class="input-wrap"><input id="stepInput" type="number" value="${data[s.key]||""}" placeholder="${s.placeholder||""}"><span class="unit">${s.unit}</span></div></div>`;}
if(s.type==="select"){html=`<div class="step-card"><div class="step-label">BASIC INFO</div><div class="step-title">${s.title}</div><div class="choices">${s.options.map(([label,val])=>`<button type="button" class="choice ${String(data[s.key])===String(val)?"selected":""}" data-value="${val}">${label}</button>`).join("")}</div></div>`;}
if(s.type==="choice"){const qNo=idx-7;html=`<div class="step-card"><div class="step-label">${s.icon} ${s.group}</div><div class="q-count">質問 ${qNo+1} / ${questions.length}</div><div class="step-title">${s.text}</div><div class="choices">${s.options.map(([label,val])=>`<button type="button" class="choice ${answers[qNo]===val?"selected":""}" data-value="${val}">${label}</button>`).join("")}</div></div>`;}
if(s.type==="loading"){html=`<div class="loader"><div class="step-title">${s.title}</div><p>${s.sub}</p><div class="loader-bar"><div class="loader-fill"></div></div></div>`;}
app.innerHTML=html+`<div class="btns"><button class="secondary" id="backBtn" ${idx===0?"style='display:none'":""}>戻る</button><button class="primary" id="goBtn">${s.type==="loading"?"結果を見る":isLastQuestion?"診断結果へ":"次へ"}</button><button class="secondary" id="resetBtn">リセット</button></div>`;
document.querySelectorAll(".choice").forEach(btn=>btn.onclick=()=>{document.querySelectorAll(".choice").forEach(b=>b.classList.remove("selected"));btn.classList.add("selected");if(s.type==="select")data[s.key]=btn.dataset.value;if(s.type==="choice")answers[idx-7]=Number(btn.dataset.value);});
const input=document.getElementById("stepInput");if(input){input.oninput=()=>{data[s.key]=input.value;};setTimeout(()=>input.focus(),100);}
document.getElementById("backBtn").onclick=()=>{if(idx>0){idx--;render();scrollTo({top:0,behavior:"smooth"});}};
document.getElementById("goBtn").onclick=()=>{if(s.type==="loading"){diagnose();return;} if(idx<steps.length-1){idx++;render();scrollTo({top:0,behavior:"smooth"});} };
document.getElementById("resetBtn").onclick=()=>{idx=0;data={age:"",sex:"female",height:"",weight:"",activity:1.55,goal:"fatloss"};answers=Array(questions.length).fill(0);results.classList.add("hidden");results.innerHTML="";render();scrollTo({top:0,behavior:"smooth"});};
if(s.type==="loading")setTimeout(()=>diagnose(),2300);
}
function getScores(){const s={};Object.keys(cats).forEach(k=>s[k]=0);questions.forEach((q,i)=>s[q.cat]+=answers[i]);return s}
function calc(){const age=+data.age,h=+data.height,w=+data.weight,a=+data.activity;if(!age||!h||!w)return null;const b=data.sex==="female"?10*w+6.25*h-5*age-161:10*w+6.25*h-5*age+5;return{bmr:Math.round(b),tdee:Math.round(b*a)}}
function sortScores(s){return Object.entries(s).sort((a,b)=>b[1]-a[1])}
function type(top,second){const map={food:["🍽️ 食事改善タイプ","食事量だけでなく、食事の内容・記録・バランスを整えることで結果につながりやすいタイプです。"],activity:["🚶 活動量アップタイプ","食事をさらに減らすより、日常の消費カロリーを増やすことが近道になりやすいタイプです。"],sleep:["🌙 生活リズム改善タイプ","睡眠や生活リズムを整えることで、食欲・疲労感・継続力が安定しやすいタイプです。"],stress:["💭 メンタル整えタイプ","完璧主義やストレス食いの影響を受けやすいため、無理なく続ける仕組みづくりが大切なタイプです。"],restriction:["🌿 食べながら整えるタイプ","過去の制限やリバウンド経験から、さらに減らすよりも適切に食べて整えることが大切なタイプです。"],muscle:["💪 体づくり強化タイプ","体重だけでなく見た目を変えるために、筋肉を維持・育てる習慣が効果的なタイプです。"]};if(top==="food"&&second==="restriction")return["🍽️ 食事リセットタイプ","食事を減らすことより、食事の質と量を整え直すことが結果につながりやすいタイプです。"];if(top==="activity"&&second==="muscle")return["🚶‍♀️ 動いて引き締めるタイプ","日常の活動量と筋トレを組み合わせることで、体重だけでなく見た目も変わりやすいタイプです。"];if(top==="sleep"&&second==="stress")return["🌙 整えて痩せるタイプ","睡眠・ストレス・生活リズムを整えることで、食欲や行動が安定しやすいタイプです。"];return map[top]}
function roadmap(keys){const [f,s,t]=keys;return[[`最優先：${cats[f].priority}`,cats[f].action,"体重・体型・食事量を記録して、現状を見える化する"],[`次に：${cats[s].priority}`,cats[s].action,"週ごとに変化を確認し、やり方を微調整する"],[`仕上げ：${cats[t].priority}`,cats[t].action,"無理なく続けられる習慣だけを残す"]]}
function stars(score){const n=Math.max(1,Math.min(5,Math.round(score/8*5)));return"★".repeat(n)+"☆".repeat(5-n)}
function today(){const d=new Date();return`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`}
function diagnose(){const sc=getScores(),so=sortScores(sc),keys=so.map(x=>x[0]),top=keys[0],second=keys[1],[tn,ts]=type(top,second),ca=calc(),rm=roadmap(keys);results.classList.remove("hidden");results.innerHTML=`<div class="result-cover result-block"><div class="score">診断日：${today()}</div><div class="result-cover-title">あなた専用<br><span>ダイエットロードマップ</span></div><p>あなたの診断タイプ</p><div class="type-name">${tn}</div><p class="small">この結果をもとに、今日からできることから始めていきましょう。</p></div><div class="result-hero result-block"><div class="small">診断結果</div><div class="type-name">${tn}</div><p>${ts}</p><div class="pill-list">${so.slice(0,3).map(([k])=>`<span class="pill">${cats[k].icon} ${cats[k].label}</span>`).join("")}</div></div><div class="result-block"><div class="section-title" style="margin-top:22px;"><span class="num">1</span><h2>スコアバランス</h2></div><div class="card"><div class="radar">${so.map(([k,v])=>`<div class="radar-row"><strong>${cats[k].icon} ${cats[k].label}</strong><div class="bar"><span style="width:${Math.round(v/8*100)}%"></span></div><span>${v}/8</span></div>`).join("")}</div></div></div><div class="result-block"><div class="section-title" style="margin-top:22px;"><span class="num">2</span><h2>痩せない原因ランキング</h2></div><div class="grid cols-3">${so.slice(0,3).map(([k,v],i)=>`<div class="rank-card"><span class="rank">${i+1}位</span><h3>${cats[k].icon} ${cats[k].label}</h3><div class="score">スコア：${v}点 / 8点</div><div class="stars">${stars(v)}</div><div class="meter"><span style="width:${Math.round(v/8*100)}%"></span></div><strong>${cats[k].causeTitle}</strong><p>${cats[k].causeText}</p></div>`).join("")}</div></div><div class="result-block"><div class="section-title" style="margin-top:22px;"><span class="num">3</span><h2>改善の優先順位</h2></div><div class="priority-list">${keys.slice(0,5).map((k,i)=>`<div class="priority-item"><span class="rank">${i+1}</span><span>${cats[k].icon} ${cats[k].priority}</span></div>`).join("")}</div></div><div class="result-block"><div class="section-title" style="margin-top:22px;"><span class="num">4</span><h2>あなた専用90日ロードマップ</h2></div><div class="roadmap">${rm.map((items,i)=>`<div class="month"><h3>${i+1}ヶ月目</h3><ul class="clean">${items.map(x=>`<li>${x}</li>`).join("")}</ul></div>`).join("")}</div></div><div class="result-block"><div class="section-title" style="margin-top:22px;"><span class="num">5</span><h2>あなたへのアドバイス</h2></div><div class="card"><p>${cats[top].advice} その次に「${cats[second].priority}」を加えると、より安定して進めやすくなります。${ca?` 参考として、あなたの推定基礎代謝は約${ca.bmr}kcal、推定TDEEは約${ca.tdee}kcalです。`:''}</p></div></div><div class="result-block"><div class="section-title" style="margin-top:22px;"><span class="num">6</span><h2>今日やること</h2></div><div class="todo"><ul class="clean"><li>${cats[top].todo}</li><li>教科書の ${cats[top].chapter} を読み返す</li><li>現状把握シートに今日の記録を書く</li></ul></div></div><div class="result-block"><div class="section-title" style="margin-top:22px;"><span class="num">7</span><h2>根拠メモ</h2></div><div class="evidence"><ul class="clean"><li>体重管理は、摂取エネルギーと消費エネルギーの長期的なバランスが土台です。</li><li>健康的な減量には、食事だけでなく身体活動・睡眠・ストレス管理も関わります。</li><li>減量後は身体が省エネになりやすく、食欲や消費エネルギーの変化が起こるため、短期集中ではなく続けられる習慣が重要です。</li></ul></div></div><div class="btns no-print"><button class="primary" onclick="window.print()">診断結果をPDF保存/印刷する</button><button class="secondary" onclick="location.reload()">最初から診断する</button></div>`;results.scrollIntoView({behavior:"smooth"})}
render();
</script>
