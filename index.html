  <style>
    :root{--ivory:#fffaf4;--white:#fff;--pink:#d9798b;--pink-dark:#b95670;--pink-soft:#fff0f3;--gold:#c8a46a;--gold-soft:#f4ead8;--brown:#3d2a1d;--muted:#876f60;--line:#ead7c8;--glass:rgba(255,255,255,.82);--shadow:0 20px 50px rgba(99,65,39,.13)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--brown);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",YuGothic,"Noto Sans JP",Meiryo,sans-serif;line-height:1.85;min-height:100vh;background:radial-gradient(circle at 8% 0%,rgba(255,222,216,.95),transparent 27%),radial-gradient(circle at 94% 8%,rgba(246,226,188,.78),transparent 25%),radial-gradient(circle at 50% 100%,rgba(255,239,244,.95),transparent 32%),linear-gradient(135deg,#fffefa 0%,#fff6ef 48%,#fffaf7 100%)}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.32;background-image:linear-gradient(115deg,transparent 0 38%,rgba(200,164,106,.18) 38.3% 38.7%,transparent 39% 100%),linear-gradient(45deg,transparent 0 72%,rgba(217,121,139,.10) 72.2% 72.7%,transparent 73% 100%);mix-blend-mode:multiply}.wrap{width:min(1080px,92vw);margin:0 auto;padding:28px 0 70px}.hero,.panel{position:relative;background:var(--glass);border:1px solid rgba(234,215,200,.92);border-radius:34px;box-shadow:var(--shadow);overflow:hidden;backdrop-filter:blur(10px)}.hero{padding:42px 26px;text-align:center}.hero:after,.panel:after{content:"";position:absolute;inset:10px;border:1px solid rgba(200,164,106,.24);border-radius:28px;pointer-events:none}.ribbon{position:absolute;left:-40px;right:-40px;top:-74px;height:142px;background:linear-gradient(135deg,rgba(255,255,255,.15),rgba(236,192,154,.42),rgba(255,245,238,.2));transform:rotate(-2deg);opacity:.96}.hero>*:not(.ribbon),.panel>*{position:relative;z-index:1}.badge{display:inline-block;padding:7px 16px;border-radius:999px;background:linear-gradient(135deg,var(--pink),var(--pink-dark));color:#fff;font-weight:800;letter-spacing:.10em;font-size:13px}h1,h2,h3{font-family:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;letter-spacing:.04em;line-height:1.45;margin:0}h1{font-size:clamp(30px,6vw,58px);margin:16px 0 10px}h1 span,.pink{color:var(--pink)}.lead{max-width:830px;margin:0 auto;color:var(--muted);font-size:16px}.note{max-width:900px;margin:18px auto 0;text-align:left;padding:13px 16px;border-radius:18px;background:#fff7f8;border:1px solid #f0cfd5;color:#6e5044;font-size:14px}.panel{margin-top:24px;padding:26px}.section-title{display:flex;gap:10px;align-items:center;margin-bottom:16px}.num{min-width:40px;height:40px;border-radius:999px;display:inline-grid;place-items:center;background:linear-gradient(135deg,var(--pink),var(--pink-dark));color:#fff;font-weight:900;font-family:Georgia,serif;box-shadow:0 8px 16px rgba(217,121,139,.22)}h2{font-size:clamp(22px,3.4vw,34px)}h3{font-size:clamp(18px,2.4vw,25px)}.sub{color:var(--muted);margin-top:-6px}.progress-wrap{margin:20px auto 0;max-width:760px}.progress-text{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:800;margin-bottom:8px}.progress-bar{height:9px;border-radius:999px;background:#f2dfe4;overflow:hidden}.progress-fill{height:100%;width:25%;background:linear-gradient(90deg,var(--pink),var(--gold));border-radius:999px;transition:.35s ease}.form-row{display:grid;gap:12px;margin-top:14px}@media(min-width:760px){.form-row{grid-template-columns:repeat(4,1fr)}}.field{display:grid;gap:6px}.field label{font-weight:800;color:var(--muted);font-size:13px}input,select{width:100%;padding:13px 12px;border:1px solid #e9d4c5;border-radius:15px;background:white;color:var(--brown);font-size:16px}.step{display:none}.step.active{display:block;animation:fade .28s ease}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}.step-head{display:flex;align-items:center;gap:12px;padding:16px;border:1px solid var(--line);border-radius:22px;background:rgba(255,250,248,.82);margin:20px 0 14px}.step-head .emoji{font-size:32px}.question{padding:14px;border:1px solid #f0ddd0;background:#fff;border-radius:18px;margin:10px 0}.question-title{font-weight:900;margin-bottom:10px}.options{display:grid;gap:8px}@media(min-width:760px){.options{grid-template-columns:repeat(3,1fr)}}.option{display:flex;align-items:flex-start;gap:9px;padding:11px;border:1px solid #f2ddd6;border-radius:14px;background:#fffaf8;cursor:pointer;min-height:48px;transition:.15s ease;font-weight:700;color:#5d4435}.option:hover{border-color:#e8b8c0;background:#fff4f6}input[type=radio]{margin-top:7px;accent-color:var(--pink)}.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;justify-content:center}button{border:none;border-radius:999px;padding:14px 22px;font-weight:900;font-size:15px;cursor:pointer;letter-spacing:.04em}.primary{background:linear-gradient(135deg,var(--pink),var(--pink-dark));color:#fff;box-shadow:0 10px 22px rgba(207,95,114,.24)}.secondary{background:#fff;color:var(--brown);border:1px solid var(--line)}.hidden{display:none!important}.result-hero{text-align:center;padding:30px 18px;border-radius:26px;border:1px solid #efd0d6;background:radial-gradient(circle at 50% 0%,rgba(217,111,130,.13),transparent 45%),#fff}.type-name{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:clamp(28px,5vw,48px);color:var(--pink);font-weight:900;margin:6px 0}.grid{display:grid;gap:14px}@media(min-width:760px){.grid.cols-2{grid-template-columns:repeat(2,1fr)}.grid.cols-3{grid-template-columns:repeat(3,1fr)}}.card,.rank-card,.month{background:#fff;border:1px solid var(--line);border-radius:22px;padding:17px}.rank-card{display:grid;gap:8px}.rank{display:inline-block;width:max-content;padding:4px 12px;border-radius:999px;background:var(--pink-soft);color:var(--pink-dark);font-weight:900}.score{color:var(--muted);font-size:13px}.meter{height:8px;background:#f1e3db;border-radius:999px;overflow:hidden;margin-top:4px}.meter span{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--gold);border-radius:999px}.priority-list{display:grid;gap:10px}.priority-item{display:flex;align-items:center;gap:10px;padding:13px;border:1px solid var(--line);background:#fff7f1;border-radius:16px;font-weight:800}.roadmap{display:grid;gap:14px}@media(min-width:760px){.roadmap{grid-template-columns:repeat(3,1fr)}}.month h3{color:var(--pink);margin-bottom:8px}ul.clean{padding-left:1.2em;margin:8px 0 0}.small{font-size:13px;color:var(--muted)}.evidence{background:#fffaf8;border-left:4px solid var(--gold);padding:14px 16px;border-radius:14px;color:#684f40;font-size:14px}.pill-list{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}.pill{background:var(--gold-soft);border:1px solid #ead5ae;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:900}.radar{display:grid;gap:10px;margin-top:10px}.radar-row{display:grid;grid-template-columns:120px 1fr 42px;gap:10px;align-items:center;font-size:14px}.bar{height:11px;background:#f0e0d8;border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--gold));border-radius:999px}.todo{background:#fff7f8;border:1px solid #f0cfd5;border-radius:22px;padding:17px}footer{text-align:center;color:var(--muted);font-size:12px;margin-top:24px}@media print{body{background:white}.hero,.panel{box-shadow:none}.no-print{display:none!important}.wrap{width:100%;padding:0}}

<body>
<main class="wrap">
  <header class="hero"><div class="ribbon"></div><span class="badge">購入者限定特典</span><h1>あなた専用<br><span>ダイエットロードマップ診断</span></h1><p class="lead">24問に答えるだけで、今のあなたに必要な「痩せない原因」「改善の優先順位」「90日ロードマップ」が分かります。</p><div class="note">※この診断は一般的な健康・ダイエット知識をもとにしたセルフチェックです。医療的な診断・治療を目的とするものではありません。</div><div class="progress-wrap no-print"><div class="progress-text"><span id="progressLabel">STEP 1 / 4</span><span id="progressPercent">25%</span></div><div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div></div></header>
  <section class="panel no-print" id="diagnosisForm"><div class="section-title"><span class="num">1</span><h2>診断スタート</h2></div><p class="sub">基本情報を入力すると、基礎代謝・TDEEの目安も表示できます。未入力でも診断は可能です。</p><div class="form-row"><div class="field"><label for="age">年齢</label><input id="age" type="number" min="10" max="99" placeholder="例：27"></div><div class="field"><label for="sex">性別</label><select id="sex"><option value="female">女性</option><option value="male">男性</option></select></div><div class="field"><label for="height">身長(cm)</label><input id="height" type="number" min="100" max="230" placeholder="例：153"></div><div class="field"><label for="weight">体重(kg)</label><input id="weight" type="number" min="20" max="250" step="0.1" placeholder="例：47"></div></div><div class="form-row"><div class="field"><label for="activity">普段の活動量</label><select id="activity"><option value="1.2">かなり少ない（座りっぱなし）</option><option value="1.375">少なめ（軽い移動・家事）</option><option value="1.55" selected>普通（週1〜3回運動）</option><option value="1.725">多い（週4回以上運動）</option></select></div><div class="field"><label for="goal">今一番叶えたいこと</label><select id="goal"><option value="fatloss" selected>体脂肪を落としたい</option><option value="shape">見た目を引き締めたい</option><option value="maintain">リバウンドせず維持したい</option></select></div></div><div id="steps"></div><div class="btns"><button class="secondary" type="button" id="prevBtn" onclick="prevStep()">戻る</button><button class="primary" type="button" id="nextBtn" onclick="nextStep()">次へ</button><button class="primary hidden" type="button" id="diagnoseBtn" onclick="diagnose()">診断結果を見る</button><button class="secondary" type="button" onclick="resetForm()">リセット</button></div></section>
  <section class="panel hidden" id="results"><div class="result-hero"><div class="small">診断結果</div><div class="type-name" id="typeName"></div><p id="typeSummary"></p><div class="pill-list" id="topPills"></div></div></section><footer>© ダイエット卒業の教科書</footer>
</main>
<script>
const categories={food:{label:"食事バランス",icon:"🍽️",causeTitle:"食事の内容・量が整っていない",causeText:"摂取カロリーや栄養バランスが安定していないと、体脂肪が落ちにくくなります。",priority:"食事を整える",action:"主食・タンパク質・野菜をそろえ、間食や飲み物も記録する",todo:"今日食べたものを、飲み物・間食まで含めて記録する",chapter:"第3章「痩せる食事」",advice:"食事を大きく減らす前に、まずは内容を見える化しましょう。タンパク質・野菜・主食のバランスを整えることで、我慢ではなく続けられる食事に近づきます。"},activity:{label:"活動量不足",icon:"🚶",causeTitle:"日常の消費カロリーが少ない",causeText:"座り時間が長く歩数が少ないと、消費カロリーが不足しやすくなります。",priority:"日常の活動量を増やす",action:"今より+1,000〜2,000歩を目安に増やす",todo:"今日の歩数を確認して、明日は+1,000歩を目標にする",chapter:"第4章「痩せる運動と生活習慣」",advice:"食事をさらに減らす前に、日常の動きを増やすことが優先です。歩数・階段・家事など小さな活動を増やすだけでも、消費カロリーの底上げにつながります。"},sleep:{label:"睡眠・生活リズム",icon:"🌙",causeTitle:"睡眠不足で食欲や行動が乱れやすい",causeText:"睡眠不足は食欲・間食・疲労感に影響し、食事管理や活動量アップを難しくします。",priority:"睡眠と生活リズムを整える",action:"起床時間をそろえ、寝る前のスマホ時間を減らす",todo:"今夜の寝る時間を決めて、寝る30分前はスマホを閉じる",chapter:"第4章「痩せる運動と生活習慣」",advice:"睡眠が乱れると、食欲や疲労感に影響しやすくなります。まずは起床時間をそろえ、寝る前のスマホや夜更かしを少しずつ減らしていきましょう。"},stress:{label:"ストレス・メンタル",icon:"💭",causeTitle:"ストレスで食欲や継続力が乱れやすい",causeText:"我慢が続くと反動で食べやすくなり、ダイエットが短期集中で終わりやすくなります。",priority:"ストレス対策を作る",action:"食べる以外のリセット方法を3つ用意する",todo:"食べる以外のリセット方法を1つ決める",chapter:"第5章「リバウンドしない思考」",advice:"完璧にやろうとすると、できなかった日の反動が大きくなります。食べる以外のストレス解消法を持ち、70点でも続けることを目指しましょう。"},restriction:{label:"過去の極端な食事制限",icon:"⚠️",causeTitle:"食事制限の反動が起きやすい",causeText:"極端な制限を繰り返すと、活動量低下や反動食いにつながり、長期的に続きにくくなります。",priority:"食べながら整える",action:"摂取カロリーを下げすぎず、まずは記録して現状を把握する",todo:"食事を減らす前に、現状把握シートに今の食事量を書く",chapter:"第1章「ダイエットの大原則」",advice:"過去に極端な食事制限を繰り返してきた人ほど、さらに減らすより整えることが大切です。まずは適切な摂取量を知り、食べながら体を戻していきましょう。"},muscle:{label:"筋力・体づくり不足",icon:"💪",causeTitle:"見た目を変える土台が不足している",causeText:"体重だけを落としても、筋肉量が少ないと引き締まりにくく、理想の見た目に近づきにくいことがあります。",priority:"筋トレを取り入れる",action:"週2回、下半身・背中・お尻を中心に軽い筋トレを始める",todo:"スクワット・ヒップリフトなど下半身トレを1種目だけ試す",chapter:"第4章「痩せる運動と生活習慣」",advice:"見た目を変えたいなら、体重だけでなく筋肉を維持することも大切です。下半身・背中・お尻を中心に、無理のない筋トレを取り入れていきましょう。"}};
const stepGroups=[{title:"食事・活動量",icon:"🍽️",items:[["食事記録をしても、間食・飲み物・調味料を入れ忘れることが多い","food"],["タンパク質や野菜が不足していると感じる","food"],["忙しい日は、パン・麺・お菓子だけで済ませることがある","food"],["外食やコンビニで何を選べばいいか分からない","food"],["運動しない日の歩数が少ない、または座っている時間が長い","activity"],["移動は車・エレベーター中心で、日常であまり動かない","activity"]]},{title:"活動量・睡眠",icon:"🌙",items:[["運動はしているけど、それ以外の時間はほとんど座っている","activity"],["食事を減らしているのに、生活全体の活動量は少ない","activity"],["睡眠時間が6時間未満の日が多い","sleep"],["寝不足の日ほど甘いものや高カロリーなものを食べたくなる","sleep"],["起床・就寝時間が日によって大きくバラバラ","sleep"],["疲れていて運動や自炊を後回しにしやすい","sleep"]]},{title:"ストレス・過去の制限",icon:"💭",items:[["ストレスが溜まると食べて発散しやすい","stress"],["体重が増えると落ち込み、極端な調整をしたくなる","stress"],["完璧にできないと、もういいやと投げ出しやすい","stress"],["毎日体重に一喜一憂して、気持ちが左右されやすい","stress"],["過去に糖質制限・断食・置き換えなどを短期間で頑張ったことがある","restriction"],["食べる量を減らして痩せても、反動で戻った経験がある","restriction"]]},{title:"食事制限・体づくり",icon:"💪",items:[["今も「もっと食べる量を減らさないと」と思いやすい","restriction"],["ダイエット中は外食やお菓子に罪悪感を持ちやすい","restriction"],["筋トレより有酸素や食事制限を優先しがち","muscle"],["体重は落ちても、見た目が思うように変わらなかった経験がある","muscle"],["お尻・背中・脚などの筋トレ習慣がほとんどない","muscle"],["引き締めたいけど、何から筋トレすればいいか分からない","muscle"]]}];
const answers=[{label:"当てはまらない",value:0},{label:"少し当てはまる",value:1},{label:"かなり当てはまる",value:2}];let currentStep=0;
function renderSteps(){const root=document.getElementById("steps");root.innerHTML="";let qIndex=0;stepGroups.forEach((group,stepIndex)=>{const step=document.createElement("div");step.className="step";step.id=`step${stepIndex}`;step.innerHTML=`<div class="step-head"><span class="emoji">${group.icon}</span><div><h3>STEP ${stepIndex+1}：${group.title}</h3><div class="small">直近1〜2ヶ月の自分に近いものを選んでください。</div></div></div>`;group.items.forEach(item=>{const [text,category]=item;const div=document.createElement("div");div.className="question";div.dataset.category=category;div.innerHTML=`<div class="question-title">Q${qIndex+1}. ${text}</div><div class="options">${answers.map(a=>`<label class="option"><input type="radio" name="q${qIndex}" value="${a.value}" ${a.value===0?"checked":""}><span>${a.label}</span></label>`).join("")}</div>`;step.appendChild(div);qIndex++});root.appendChild(step)});updateStep()}
function updateStep(){document.querySelectorAll(".step").forEach((el,i)=>el.classList.toggle("active",i===currentStep));document.getElementById("prevBtn").style.display=currentStep===0?"none":"inline-block";document.getElementById("nextBtn").classList.toggle("hidden",currentStep===stepGroups.length-1);document.getElementById("diagnoseBtn").classList.toggle("hidden",currentStep!==stepGroups.length-1);const percent=Math.round(((currentStep+1)/stepGroups.length)*100);document.getElementById("progressLabel").textContent=`STEP ${currentStep+1} / ${stepGroups.length}`;document.getElementById("progressPercent").textContent=`${percent}%`;document.getElementById("progressFill").style.width=`${percent}%`}
function nextStep(){if(currentStep<stepGroups.length-1){currentStep++;updateStep();document.getElementById("diagnosisForm").scrollIntoView({behavior:"smooth"})}}function prevStep(){if(currentStep>0){currentStep--;updateStep();document.getElementById("diagnosisForm").scrollIntoView({behavior:"smooth"})}}
function getScores(){const scores={};Object.keys(categories).forEach(k=>scores[k]=0);let index=0;stepGroups.forEach(group=>group.items.forEach(item=>{const cat=item[1];const checked=document.querySelector(`input[name="q${index}"]:checked`);scores[cat]+=Number(checked?.value||0);index++}));return scores}function calcBmrTdee(){const age=Number(document.getElementById("age").value),sex=document.getElementById("sex").value,height=Number(document.getElementById("height").value),weight=Number(document.getElementById("weight").value),activity=Number(document.getElementById("activity").value);if(!age||!height||!weight)return null;const bmr=sex==="female"?10*weight+6.25*height-5*age-161:10*weight+6.25*height-5*age+5;return{bmr:Math.round(bmr),tdee:Math.round(bmr*activity)}}function getSorted(scores){return Object.entries(scores).sort((a,b)=>b[1]-a[1])}
function typeByTop(top,second){const map={food:{name:"🍽️ 食事改善タイプ",summary:"食事量だけでなく、食事の内容・記録・バランスを整えることで結果につながりやすいタイプです。"},activity:{name:"🚶 活動量アップタイプ",summary:"食事をさらに減らすより、日常の消費カロリーを増やすことが近道になりやすいタイプです。"},sleep:{name:"🌙 生活リズム改善タイプ",summary:"睡眠や生活リズムを整えることで、食欲・疲労感・継続力が安定しやすいタイプです。"},stress:{name:"💭 メンタル整えタイプ",summary:"完璧主義やストレス食いの影響を受けやすいため、無理なく続ける仕組みづくりが大切なタイプです。"},restriction:{name:"🌿 食べながら整えるタイプ",summary:"過去の制限やリバウンド経験から、さらに減らすよりも適切に食べて整えることが大切なタイプです。"},muscle:{name:"💪 体づくり強化タイプ",summary:"体重だけでなく見た目を変えるために、筋肉を維持・育てる習慣が効果的なタイプです。"}};if(top==="food"&&second==="restriction")return{name:"🍽️ 食事リセットタイプ",summary:"食事を減らすことより、食事の質と量を整え直すことが結果につながりやすいタイプです。"};if(top==="activity"&&second==="muscle")return{name:"🚶‍♀️ 動いて引き締めるタイプ",summary:"日常の活動量と筋トレを組み合わせることで、体重だけでなく見た目も変わりやすいタイプです。"};if(top==="sleep"&&second==="stress")return{name:"🌙 整えて痩せるタイプ",summary:"睡眠・ストレス・生活リズムを整えることで、食欲や行動が安定しやすいタイプです。"};return map[top]}
function makeRoadmap(keys,goal){const [first,second,third]=keys;return[[`最優先：${categories[first].priority}`,categories[first].action,"体重・体型・食事量を記録して、現状を見える化する"],[`次に：${categories[second].priority}`,categories[second].action,goal==="shape"?"週2回の筋トレで見た目の変化を作る":"週ごとに変化を確認し、やり方を微調整する"],[`仕上げ：${categories[third].priority}`,categories[third].action,goal==="maintain"?"リバウンドしない生活パターンを固定する":"無理なく続けられる習慣だけを残す"]]}
function makeAdvice(top,second,calc){let text=categories[top].advice;text+=` その次に「${categories[second].priority}」を加えると、より安定して進めやすくなります。`;if(calc)text+=` 参考として、あなたの推定基礎代謝は約${calc.bmr}kcal、推定TDEEは約${calc.tdee}kcalです。これは目安なので、体重・体型の変化を見ながら調整してください。`;return text}
function diagnose(){const scores=getScores(),sorted=getSorted(scores),keys=sorted.map(([key])=>key),top=keys[0],second=keys[1];const type=typeByTop(top,second),calc=calcBmrTdee(),goal=document.getElementById("goal").value,roadmap=makeRoadmap(keys,goal);const results=document.getElementById("results");results.classList.remove("hidden");document.getElementById("typeName").textContent=type.name;document.getElementById("typeSummary").textContent=type.summary;document.getElementById("topPills").innerHTML=sorted.slice(0,3).map(([key])=>`<span class="pill">${categories[key].icon} ${categories[key].label}</span>`).join("");results.querySelectorAll(".generated").forEach(el=>el.remove());
const radar=document.createElement("div");radar.className="generated";radar.innerHTML=`<div class="section-title" style="margin-top:22px;"><span class="num">1</span><h2>スコアバランス</h2></div><div class="card"><div class="radar">${sorted.map(([key,score])=>`<div class="radar-row"><strong>${categories[key].icon} ${categories[key].label}</strong><div class="bar"><span style="width:${Math.round(score/8*100)}%"></span></div><span>${score}/8</span></div>`).join("")}</div></div>`;results.appendChild(radar);
const cause=document.createElement("div");cause.className="generated";cause.innerHTML=`<div class="section-title" style="margin-top:22px;"><span class="num">2</span><h2>痩せない原因ランキング</h2></div><div class="grid cols-3">${sorted.slice(0,3).map(([key,score],i)=>`<div class="rank-card"><span class="rank">${i+1}位</span><h3>${categories[key].icon} ${categories[key].label}</h3><div class="score">スコア：${score}点 / 8点</div><div class="meter"><span style="width:${Math.round(score/8*100)}%"></span></div><strong>${categories[key].causeTitle}</strong><p>${categories[key].causeText}</p></div>`).join("")}</div>`;results.appendChild(cause);
const priority=document.createElement("div");priority.className="generated";priority.innerHTML=`<div class="section-title" style="margin-top:22px;"><span class="num">3</span><h2>改善の優先順位</h2></div><p class="small">原因説明とは分けて、ここでは「何から取り組むか」だけを表示します。</p><div class="priority-list">${keys.slice(0,5).map((key,i)=>`<div class="priority-item"><span class="rank">${i+1}</span><span>${categories[key].icon} ${categories[key].priority}</span></div>`).join("")}</div>`;results.appendChild(priority);
const road=document.createElement("div");road.className="generated";road.innerHTML=`<div class="section-title" style="margin-top:22px;"><span class="num">4</span><h2>あなた専用90日ロードマップ</h2></div><div class="roadmap">${roadmap.map((items,idx)=>`<div class="month"><h3>${idx+1}ヶ月目</h3><ul class="clean">${items.map(item=>`<li>${item}</li>`).join("")}</ul></div>`).join("")}</div>`;results.appendChild(road);
const advice=document.createElement("div");advice.className="generated";advice.innerHTML=`<div class="section-title" style="margin-top:22px;"><span class="num">5</span><h2>あなたへのアドバイス</h2></div><div class="card"><p>${makeAdvice(top,second,calc)}</p></div>`;results.appendChild(advice);
const todo=document.createElement("div");todo.className="generated";todo.innerHTML=`<div class="section-title" style="margin-top:22px;"><span class="num">6</span><h2>今日やること</h2></div><div class="todo"><ul class="clean"><li>${categories[top].todo}</li><li>教科書の ${categories[top].chapter} を読み返す</li><li>現状把握シートに今日の記録を書く</li></ul></div>`;results.appendChild(todo);
const evidence=document.createElement("div");evidence.className="generated";evidence.innerHTML=`<div class="section-title" style="margin-top:22px;"><span class="num">7</span><h2>根拠メモ</h2></div><div class="evidence"><ul class="clean"><li>体重管理は、摂取エネルギーと消費エネルギーの長期的なバランスが土台です。</li><li>健康的な減量には、食事だけでなく身体活動・睡眠・ストレス管理も関わります。</li><li>減量後は身体が省エネになりやすく、食欲や消費エネルギーの変化が起こるため、短期集中ではなく続けられる習慣が重要です。</li></ul><p class="small">参考：CDC、NIH/NCBIの体重管理・睡眠・減量維持に関する情報をもとに、教材用に分かりやすく整理しています。</p></div><div class="btns no-print"><button class="primary" type="button" onclick="window.print()">結果をPDF保存/印刷する</button><button class="secondary" type="button" onclick="window.scrollTo({top:0,behavior:'smooth'})">最初に戻る</button></div>`;results.appendChild(evidence);results.scrollIntoView({behavior:"smooth"})}
function resetForm(){currentStep=0;updateStep();document.querySelectorAll('input[type="radio"][value="0"]').forEach(el=>el.checked=true);["age","height","weight"].forEach(id=>document.getElementById(id).value="");document.getElementById("results").classList.add("hidden");document.querySelectorAll(".generated").forEach(el=>el.remove());window.scrollTo({top:0,behavior:"smooth"})}renderSteps();
</script>
