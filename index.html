</style>

function maxScore(cat){return qs.filter(q=>q.cat===cat).length*2}
function getScores(){const s={};Object.keys(categories).forEach(k=>s[k]=0);qs.forEach((q,i)=>s[q.cat]+=Number(responses[i]||0));return s}
function calc(){const age=+metaAns.age,sex=metaAns.sex,h=+metaAns.height,w=+metaAns.weight,a=+metaAns.activity;if(!age||!h||!w)return null;const b=sex==="female"?10*w+6.25*h-5*age-161:10*w+6.25*h-5*age+5;return{bmr:Math.round(b),tdee:Math.round(b*a)}}
function sortScores(s){return Object.entries(s).sort((a,b)=>(b[1]/maxScore(b[0]))-(a[1]/maxScore(a[0])))}
function type(top,second){const map={food:["🍽️ 食事改善タイプ","食事量だけでなく、食事の内容・記録・バランスを整えることで結果につながりやすいタイプです。"],activity:["🚶 活動量アップタイプ","食事をさらに減らすより、日常の消費カロリーを増やすことが近道になりやすいタイプです。"],sleep:["🌙 生活リズム改善タイプ","睡眠や生活リズムを整えることで、食欲・疲労感・継続力が安定しやすいタイプです。"],stress:["💭 メンタル整えタイプ","完璧主義やストレス食いの影響を受けやすいため、無理なく続ける仕組みづくりが大切なタイプです。"],restriction:["🌿 食べながら整えるタイプ","過去の制限やリバウンド経験から、さらに減らすよりも適切に食べて整えることが大切なタイプです。"],muscle:["💪 体づくり強化タイプ","体重だけでなく見た目を変えるために、筋肉を維持・育てる習慣が効果的なタイプです。"]};if(top==="food"&&second==="restriction")return["🍽️ 食事リセットタイプ","食事を減らすことより、食事の質と量を整え直すことが結果につながりやすいタイプです。"];if(top==="activity"&&second==="muscle")return["🚶‍♀️ 動いて引き締めるタイプ","日常の活動量と筋トレを組み合わせることで、体重だけでなく見た目も変わりやすいタイプです。"];if(top==="sleep"&&second==="stress")return["🌙 整えて痩せるタイプ","睡眠・ストレス・生活リズムを整えることで、食欲や行動が安定しやすいタイプです。"];return map[top]}
function roadmap(keys){const [f,s,t]=keys;return[[`最優先：${categories[f].priority}`,categories[f].action,"体重・体型・食事量を記録して、現状を見える化する"],[`次に：${categories[s].priority}`,categories[s].action,metaAns.goal==="shape"?"週2回の筋トレで見た目の変化を作る":"週ごとに変化を確認し、やり方を微調整する"],[`仕上げ：${categories[t].priority}`,categories[t].action,metaAns.goal==="maintain"?"リバウンドしない生活パターンを固定する":"無理なく続けられる習慣だけを残す"]]}
function stars(score,max){const n=Math.max(1,Math.min(5,Math.round(score/max*5)));return"★".repeat(n)+"☆".repeat(5-n)}
function today(){const d=new Date();return`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`}
function diagnose(){const inp=document.getElementById("singleInput");if(inp)metaAns[allSteps[current].key]=inp.value;app.classList.add("hidden");loading.classList.remove("hidden");setTimeout(()=>{loading.classList.add("hidden");showResult()},900)}
function showResult(){const sc=getScores(),so=sortScores(sc),keys=so.map(x=>x[0]),top=keys[0],second=keys[1],[tn,ts]=type(top,second),ca=calc(),rm=roadmap(keys);results.classList.remove("hidden");results.innerHTML=`<div class="result-cover result-block"><div class="score">診断日：${today()}</div><div class="result-cover-title">あなた専用<br><span>ダイエットロードマップ</span></div><p>あなたの診断タイプ</p><div class="type-name">${tn}</div><p class="small">この結果をもとに、今日からできることから始めていきましょう。</p></div><div class="result-hero result-block"><div class="small">診断結果</div><div class="type-name">${tn}</div><p>${ts}</p><div class="pill-list">${so.slice(0,3).map(([k])=>`<span class="pill">${categories[k].icon} ${categories[k].label}</span>`).join("")}</div></div><div class="result-block"><div class="section-title" style="margin-top:22px;"><span class="rank">1</span><h2>スコアバランス</h2></div><div class="card"><div class="radar">${so.map(([k,v])=>`<div class="radar-row"><strong>${categories[k].icon} ${categories[k].label}</strong><div class="bar"><span style="width:${Math.round(v/maxScore(k)*100)}%"></span></div><span>${v}/${maxScore(k)}</span></div>`).join("")}</div></div></div><div class="result-block"><div class="section-title" style="margin-top:22px;"><span class="rank">2</span><h2>痩せない原因ランキング</h2></div><div class="grid cols-3">${so.slice(0,3).map(([k,v],i)=>`<div class="rank-card"><span class="rank">${i+1}位</span><h3>${categories[k].icon} ${categories[k].label}</h3><div class="score">スコア：${v}点 / ${maxScore(k)}点</div><div class="stars">${stars(v,maxScore(k))}</div><div class="meter"><span style="width:${Math.round(v/maxScore(k)*100)}%"></span></div><strong>${categories[k].causeTitle}</strong><p>${categories[k].causeText}</p></div>`).join("")}</div></div><div class="result-block"><div class="section-title" style="margin-top:22px;"><span class="rank">3</span><h2>改善の優先順位</h2></div><div class="priority-list">${keys.slice(0,5).map((k,i)=>`<div class="priority-item"><span class="rank">${i+1}</span><span>${categories[k].icon} ${categories[k].priority}</span></div>`).join("")}</div></div><div class="result-block"><div class="section-title" style="margin-top:22px;"><span class="rank">4</span><h2>あなた専用90日ロードマップ</h2></div><div class="roadmap">${rm.map((items,i)=>`<div class="month"><h3>${i+1}ヶ月目</h3><ul class="clean">${items.map(x=>`<li>${x}</li>`).join("")}</ul></div>`).join("")}</div></div><div class="result-block"><div class="section-title" style="margin-top:22px;"><span class="rank">5</span><h2>あなたへのアドバイス</h2></div><div class="card"><p>${categories[top].advice} その次に「${categories[second].priority}」を加えると、より安定して進めやすくなります。${ca?` 参考として、あなたの推定基礎代謝は約${ca.bmr}kcal、推定TDEEは約${ca.tdee}kcalです。`:''}</p></div></div><div class="result-block"><div class="section-title" style="margin-top:22px;"><span class="rank">6</span><h2>今日やること</h2></div><div class="todo"><ul class="clean"><li>${categories[top].todo}</li><li>教科書の ${categories[top].chapter} を読み返す</li><li>現状把握シートに今日の記録を書く</li></ul></div></div><div class="result-block"><div class="section-title" style="margin-top:22px;"><span class="rank">7</span><h2>根拠メモ</h2></div><div class="evidence"><ul class="clean"><li>体重管理は、摂取エネルギーと消費エネルギーの長期的なバランスが土台です。</li><li>健康的な減量には、食事だけでなく身体活動・睡眠・ストレス管理も関わります。</li><li>減量後は身体が省エネになりやすく、食欲や消費エネルギーの変化が起こるため、短期集中ではなく続けられる習慣が重要です。</li></ul></div></div><div class="btns no-print"><button class="primary" onclick="window.print()">診断結果をPDF保存/印刷する</button><button class="secondary" onclick="location.reload()">もう一度診断する</button></div>`}
prevBtn.onclick=prev;nextBtn.onclick=next;diagnoseBtn.onclick=diagnose;resetBtn.onclick=()=>location.reload();render();
</script>
