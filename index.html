px auto;max-width:820px;word-break:keep-all;overflow-wrap:break-word}.options{display:grid;grid-template-columns:1fr;gap:10px;max-width:560px;margin:auto}.option{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:14px;border:1px solid #f2ddd6;border-radius:18px;background:#fffaf8;cursor:pointer;font-weight:900;color:#5d4435;word-break:keep-all;overflow-wrap:break-word}.option:hover{border-color:#e8b8c0;background:#fff4f6}.option input{width:22px;height:22px;flex:0 0 22px;margin:0;accent-color:var(--pink)}.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;justify-content:center}button{border:0;border-radius:999px;padding:14px 22px;font-weight:900;font-size:15px;cursor:pointer;letter-spacing:.04em}.primary{background:linear-gradient(135deg,var(--pink),var(--pink2));color:#fff;box-shadow:0 10px 22px #cf5f723d}.secondary{background:#fff;color:var(--brown);border:1px solid var(--line)}.hidden{display:none!important}.result-hero,.result-cover{text-align:center;padding:30px 18px;border-radius:26px;border:1px solid #efd0d6;background:radial-gradient(circle at 50% 0%,#d96f8221,transparent 45%),#fff}.result-cover{margin-bottom:22px;background:radial-gradient(circle at 50% 0%,#d9798b1f,transparent 45%),linear-gradient(135deg,#fffdf9,#fff6ef)}.result-cover-title{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:clamp(26px,5vw,46px);font-weight:900;line-height:1.45;margin:8px 0}.result-cover-title span{color:var(--pink)}.type-name{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:clamp(28px,5vw,48px);color:var(--pink);font-weight:900;margin:6px 0}.grid{display:grid;gap:14px}@media(min-width:760px){.grid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}}.card,.rank-card,.month,.todo,.cta-box{background:#fff;border:1px solid var(--line);border-radius:22px;padding:17px}.rank-card{display:grid;gap:8px}.rank{display:inline-block;width:max-content;padding:4px 12px; </style></head><body><main class="wrap"><header class="hero"><div class="ribbon"></div><span class="badge">購入者限定特典</span><h1>あなた専用<br><span>ダイエットロードマップ診断</span></h1><p class="lead">24問に答えるだけで、今のあなたに必要な「痩せない原因」「改善の優先順位」「90日ロードマップ」が分かります。</p><div class="note">※この診断は一般的な健康・ダイエット知識をもとにしたセルフチェックです。医療的な診断・治療を目的とするものではありません。</div><div class="progress-wrap no-print"><div class="progress-text"><span id="progressLabel">QUESTION 1 / 24</span><span id="progressPercent">4%</span></div><div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div></div></header><section class="panel no-print" id="diagnosisForm"><div class="section-title"><span class="num">1</span><h2>基本情報</h2></div><p class="sub">入力すると、診断結果に基礎代謝・TDEEの目安も表示できます。未入力でも診断は可能です。</p><div class="form-row"><div class="field"><label for="age">年齢</label><div class="input-wrap"><input id="age" type="number" min="10" max="99" inputmode="numeric" placeholder="例：27"><span class="unit">歳</span></div></div><div class="field"><label for="sex">性別</label><select id="sex"><option value="female">女性</option><option value="male">男性</option></select></div><div class="field"><label for="height">身長</label><div class="input-wrap"><input id="height" type="number" min="100" max="230" inputmode="decimal" placeholder="例：153"><span class="unit">cm</span></div></div><div class="field"><label for="weight">体重</label><div class="input-wrap"><input id="weight" type="number" min="20" max="250" step="0.1" inputmode="decimal" placeholder="例：47"><span class="unit">kg</span></div></div></div><div class="form-row"><div class="field"><label for="activity">普段の活動量</label><select id="activity"><option value="1.2">かなり少ない（座りっぱなし）</option><option value="1.375">少なめ（軽い移動・家事）</option><option value="1.55" selected>普通（週1〜3回運動）</option><option value="1.725">多い（週4回以上運動）</option></select></div><div class="field"><label for="goal">今一番叶えたいこと</label><select id="goal"><option value="fatloss" selected>体脂肪を落としたい</option><option value="shape">見た目を引き締めたい</option><option value="maintain">リバウンドせず維持したい</option></select></div></div><div id="questionArea"></div><div class="btns"><button class="secondary" type="button" id="prevBtn">戻る</button><button class="primary" type="button" id="nextBtn">次へ</button><button class="primary hidden" type="button" id="diagnoseBtn">診断結果を見る</button><button class="secondary" type="button" id="resetBtn">リセット</button></div></section><section class="panel hidden" id="results"></section><footer>© ダイエット卒業の教科書</footer></main><script>
const C={food:{label:'食事バランス',icon:'🍽️',causeTitle:'食事の内容・量が整っていない',causeText:'摂取カロリーや栄養バランスが安定していないと、体脂肪が落ちにくくなります。',priority:'食事を整える',action:'主食・タンパク質・野菜をそろえ、間食や飲み物も記録する',todo:'今日食べたものを、飲み物・間食まで含めて記録する',chapter:'第3章「痩せる食事」',advice:'食事を大きく減らす前に、まずは内容を見える化しましょう。タンパク質・野菜・主食のバランスを整えることで、我慢ではなく続けられる食事に近づきます。'},activity:{label:'活動量不足',icon:'🚶',causeTitle:'日常の消費カロリーが少ない',causeText:'座り時間が長く歩数が少ないと、消費カロリーが不足しやすくなります。',priority:'日常の活動量を増やす',action:'今より+1,000〜2,000歩を目安に増やす',todo:'今日の歩数を確認して、明日は+1,000歩を目標にする',chapter:'第4章「痩せる運動と生活習慣」',advice:'食事をさらに減らす前に、日常の動きを増やすことが優先です。歩数・階段・家事など小さな活動を増やすだけでも、消費カロリーの底上げにつながります。'},sleep:{label:'睡眠・生活リズム',icon:'🌙',causeTitle:'睡眠不足で食欲や行動が乱れやすい',causeText:'睡眠不足は食欲・間食・疲労感に影響し、食事管理や活動量アップを難しくします。',priority:'睡眠と生活リズムを整える',action:'起床時間をそろえ、寝る前のスマホ時間を減らす',todo:'今夜の寝る時間を決めて、寝る30分前はスマホを閉じる',chapter:'第4章「痩せる運動と生活習慣」',advice:'睡眠が乱れると、食欲や疲労感に影響しやすくなります。まずは起床時間をそろえ、寝る前のスマホや夜更かしを少しずつ減らしていきましょう。'},stress:{label:'ストレス・メンタル',icon:'💭',causeTitle:'ストレスで食欲や継続力が乱れやすい',causeText:'我慢が続くと反動で食べやすくなり、ダイエットが短期集中で終わりやすくなります。',priority:'ストレス対策を作る',action:'食べる以外のリセット方法を3つ用意する',todo:'食べる以外のリセット方法を1つ決める',chapter:'第5章「リバウンドしない思考」',advice:'完璧にやろうとすると、できなかった日の反動が大きくなります。食べる以外のストレス解消法を持ち、70点でも続けることを目指しましょう。'},restriction:{label:'過去の極端な食事制限',icon:'⚠️',causeTitle:'食事制限の反動が起きやすい',causeText:'極端な制限を繰り返すと、活動量低下や反動食いにつながり、長期的に続きにくくなります。',priority:'食べながら整える',action:'摂取カロリーを下げすぎず、まずは記録して現状を把握する',todo:'食事を減らす前に、現状把握シートに今の食事量を書く',chapter:'第1章「ダイエットの大原則」',advice:'過去に極端な食事制限を繰り返してきた人ほど、さらに減らすより整えることが大切です。まずは適切な摂取量を知り、食べながら体を戻していきましょう。'},muscle:{label:'筋力・体づくり不足',icon:'💪',causeTitle:'見た目を変える土台が不足している',causeText:'体重だけを落としても、筋肉量が少ないと引き締まりにくく、理想の見た目に近づきにくいことがあります。',priority:'筋トレを取り入れる',action:'週2回、下半身・背中・お尻を中心に軽い筋トレを始める',todo:'スクワット・ヒップリフトなど下半身トレを1種目だけ試す',chapter:'第4章「痩せる運動と生活習慣」',advice:'見た目を変えたいなら、体重だけでなく筋肉を維持することも大切です。下半身・背中・お尻を中心に、無理のない筋トレを取り入れていきましょう。'}};
const Q=[['食事記録をしても、間食・飲み物・調味料を入れ忘れることが多い','food','食事・活動量','🍽️'],['タンパク質や野菜が不足していると感じる','food','食事・活動量','🍽️'],['忙しい日は、パン・麺・お菓子だけで済ませることがある','food','食事・活動量','🍽️'],['外食やコンビニで何を選べばいいか分からない','food','食事・活動量','🍽️'],['運動しない日の歩数が少ない、または座っている時間が長い','activity','食事・活動量','🚶'],['移動は車・エレベーター中心で、日常であまり動かない','activity','食事・活動量','🚶'],['運動はしているけど、それ以外の時間はほとんど座っている','activity','活動量・睡眠','🌙'],['食事を減らしているのに、生活全体の活動量は少ない','activity','活動量・睡眠','🌙'],['睡眠時間が6時間未満の日が多い','sleep','活動量・睡眠','🌙'],['寝不足の日ほど甘いものや高カロリーなものを食べたくなる','sleep','活動量・睡眠','🌙'],['起床・就寝時間が日によって大きくバラバラ','sleep','活動量・睡眠','🌙'],['疲れていて運動や自炊を後回しにしやすい','sleep','活動量・睡眠','🌙'],['ストレスが溜まると食べて発散しやすい','stress','ストレス・過去の制限','💭'],['体重が増えると落ち込み、極端な調整をしたくなる','stress','ストレス・過去の制限','💭'],['完璧にできないと、もういいやと投げ出しやすい','stress','ストレス・過去の制限','💭'],['毎日体重に一喜一憂して、気持ちが左右されやすい','stress','ストレス・過去の制限','💭'],['過去に糖質制限・断食・置き換えなどを短期間で頑張ったことがある','restriction','ストレス・過去の制限','⚠️'],['食べる量を減らして痩せても、反動で戻った経験がある','restriction','ストレス・過去の制限','⚠️'],['今も「もっと食べる量を減らさないと」と思いやすい','restriction','食事制限・体づくり','💪'],['ダイエット中は外食やお菓子に罪悪感を持ちやすい','restriction','食事制限・体づくり','💪'],['筋トレより有酸素や食事制限を優先しがち','muscle','食事制限・体づくり','💪'],['体重は落ちても、見た目が思うように変わらなかった経験がある','muscle','食事制限・体づくり','💪'],['お尻・背中・脚などの筋トレ習慣がほとんどない','muscle','食事制限・体づくり','💪'],['引き締めたいけど、何から筋トレすればいいか分からない','muscle','食事制限・体づくり','💪']].map(([text,cat,group,icon])=>({text,cat,group,icon}));
const A=[{label:'当てはまらない',value:0},{label:'少し当てはまる',value:1},{label:'かなり当てはまる',value:2}];let cur=0,R=Array(Q.length).fill(0);
function render(){let q=Q[cur];questionArea.innerHTML=`<div class="question-card active"><div class="q-head"><span class="emoji">${q.icon}</span><div><h3>${q.group}</h3><div class="small">直近1〜2ヶ月の自分に近いものを選んでください。</div></div></div><div class="q-count">質問 ${cur+1} / ${Q.length}</div><div class="q-title">${q.text}</div><div class="options">${A.map(a=>`<label class="option"><input type="radio" name="answer" value="${a.value}" ${R[cur]===a.value?'checked':''}><span>${a.label}</span></label>`).join('')}</div></div>`;let p=Math.round((cur+1)/Q.length*100);progressLabel.textContent=`QUESTION ${cur+1} / ${Q.length}`;progressPercent.textContent=p+'%';progressFill.style.width=p+'%';prevBtn.style.display=cur===0?'none':'inline-block';nextBtn.classList.toggle('hidden',cur===Q.length-1);diagnoseBtn.classList.toggle('hidden',cur!==Q.length-1);document.querySelectorAll('input[name="answer"]').forEach(i=>i.onchange=e=>{R[cur]=+e.target.value;if(cur<Q.length-1)setTimeout(()=>{cur++;render();diagnosisForm.scrollIntoView({behavior:'smooth'})},170)})}
function scores(){let s={};Object.keys(C).forEach(k=>s[k]=0);Q.forEach((q,i)=>s[q.cat]+=R[i]);return s}function sorted(s){return Object.entries(s).sort((a,b)=>b[1]-a[1])}function calc(){let age=+document.getElementById('age').value,sex=document.getElementById('sex').value,h=+height.value,w=+weight.value,act=+activity.value;if(!age||!h||!w)return null;let b=sex==='female'?10*w+6.25*h-5*age-161:10*w+6.25*h-5*age+5;return{bmr:Math.round(b),tdee:Math.round(b*act)}}
function type(top,sec){let m={food:{name:'🍽️ 食事改善タイプ',summary:'食事量だけでなく、食事の内容・記録・バランスを整えることで結果につながりやすいタイプです。'},activity:{name:'🚶 活動量アップタイプ',summary:'食事をさらに減らすより、日常の消費カロリーを増やすことが近道になりやすいタイプです。'},sleep:{name:'🌙 生活リズム改善タイプ',summary:'睡眠や生活リズムを整えることで、食欲・疲労感・継続力が安定しやすいタイプです。'},stress:{name:'💭 メンタル整えタイプ',summary:'完璧主義やストレス食いの影響を受けやすいため、無理なく続ける仕組みづくりが大切なタイプです。'},restriction:{name:'🌿 食べながら整えるタイプ',summary:'過去の制限やリバウンド経験から、さらに減らすよりも適切に食べて整えることが大切なタイプです。'},muscle:{name:'💪 体づくり強化タイプ',summary:'体重だけでなく見た目を変えるために、筋肉を維持・育てる習慣が効果的なタイプです。'}};if(top==='food'&&sec==='restriction')return{name:'🍽️ 食事リセットタイプ',summary:'食事を減らすことより、食事の質と量を整え直すことが結果につながりやすいタイプです。'};if(top==='activity'&&sec==='muscle')return{name:'🚶‍♀️ 動いて引き締めるタイプ',summary:'日常の活動量と筋トレを組み合わせることで、体重だけでなく見た目も変わりやすいタイプです。'};if(top==='sleep'&&sec==='stress')return{name:'🌙 整えて痩せるタイプ',summary:'睡眠・ストレス・生活リズムを整えることで、食欲や行動が安定しやすいタイプです。'};return m[top]}
function stars(x){let n=Math.max(1,Math.min(5,Math.round(x/8*5)));return'★'.repeat(n)+'☆'.repeat(5-n)}function date(){let d=new Date();return`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`}function roadmap(keys,g){let [a,b,c]=keys;return[[`最優先：${C[a].priority}`,C[a].action,'体重・体型・食事量を記録して、現状を見える化する'],[`次に：${C[b].priority}`,C[b].action,g==='shape'?'週2回の筋トレで見た目の変化を作る':'週ごとに変化を確認し、やり方を微調整する'],[`仕上げ：${C[c].priority}`,C[c].action,g==='maintain'?'リバウンドしない生活パターンを固定する':'無理なく続けられる習慣だけを残す']]}
function advice(t,s,ca){let x=C[t].advice+` その次に「${C[s].priority}」を加えると、より安定して進めやすくなります。`;if(ca)x+=` 参考として、あなたの推定基礎代謝は約${ca.bmr}kcal、推定TDEEは約${ca.tdee}kcalです。これは目安なので、体重・体型の変化を見ながら調整してください。`;return x}
function diagnose(){let so=sorted(scores()),keys=so.map(x=>x[0]),top=keys[0],sec=keys[1],ty=type(top,sec),ca=calc(),rm=roadmap(keys,goal.value);results.classList.remove('hidden');results.innerHTML=`<div class="result-cover result-block"><div class="score">診断日：${date()}</div><div class="result-cover-title">あなた専用<br><span>ダイエットロードマップ</span></div><p>あなたの診断タイプ</p><div class="type-name">${ty.name}</div><p class="small">この結果をもとに、今日からできることから始めていきましょう。</p></div><div class="result-hero result-block"><div class="small">診断結果</div><div class="type-name">${ty.name}</div><p>${ty.summary}</p><div class="pill-list">${so.slice(0,3).map(([k])=>`<span class="pill">${C[k].icon} ${C[k].label}</span>`).join('')}</div></div><div class="result-block"><div class="section-title" style="margin-top:22px"><span class="num">1</span><h2>スコアバランス</h2></div><div class="card"><div class="radar">${so.map(([k,v])=>`<div class="radar-row"><strong>${C[k].icon} ${C[k].label}</strong><div class="bar"><span style="width:${Math.round(v/8*100)}%"></span></div><span>${v}/8</span></div>`).join('')}</div></div></div><div class="result-block"><div class="section-title" style="margin-top:22px"><span class="num">2</span><h2>痩せない原因ランキング</h2></div><div class="grid cols-3">${so.slice(0,3).map(([k,v],i)=>`<div class="rank-card"><span class="rank">${i+1}位</span><h3>${C[k].icon} ${C[k].label}</h3><div class="score">スコア：${v}点 / 8点</div><div class="stars">${stars(v)}</div><div class="meter"><span style="width:${Math.round(v/8*100)}%"></span></div><strong>${C[k].causeTitle}</strong><p>${C[k].causeText}</p></div>`).join('')}</div></div><div class="result-block"><div class="section-title" style="margin-top:22px"><span class="num">3</span><h2>改善の優先順位</h2></div><p class="small">原因説明とは分けて、ここでは「何から取り組むか」だけを表示します。</p><div class="priority-list">${keys.slice(0,5).map((k,i)=>`<div class="priority-item"><span class="rank">${i+1}</span><span>${C[k].icon} ${C[k].priority}</span></div>`).join('')}</div></div><div class="result-block"><div class="section-title" style="margin-top:22px"><span class="num">4</span><h2>あなた専用90日ロードマップ</h2></div><div class="roadmap">${rm.map((it,i)=>`<div class="month"><h3>${i+1}ヶ月目</h3><ul class="clean">${it.map(a=>`<li>${a}</li>`).join('')}</ul></div>`).join('')}</div></div><div class="result-block"><div class="section-title" style="margin-top:22px"><span class="num">5</span><h2>あなたへのアドバイス</h2></div><div class="card"><p>${advice(top,sec,ca)}</p></div></div><div class="result-block"><div class="section-title" style="margin-top:22px"><span class="num">6</span><h2>今日やること</h2></div><div class="todo"><ul class="clean"><li>${C[top].todo}</li><li>教科書の ${C[top].chapter} を読み返す</li><li>現状把握シートに今日の記録を書く</li></ul></div></div><div class="result-block"><div class="section-title" style="margin-top:22px"><span class="num">7</span><h2>根拠メモ</h2></div><div class="evidence"><ul class="clean"><li>体重管理は、摂取エネルギーと消費エネルギーの長期的なバランスが土台です。</li><li>健康的な減量には、食事だけでなく身体活動・睡眠・ストレス管理も関わります。</li><li>減量後は身体が省エネになりやすく、食欲や消費エネルギーの変化が起こるため、短期集中ではなく続けられる習慣が重要です。</li></ul><p class="small">参考：CDC、NIH/NCBIの体重管理・睡眠・減量維持に関する情報をもとに、教材用に分かりやすく整理しています。</p></div></div><div class="cta-box result-block"><h2>次は、実践に進みましょう</h2><p>診断結果で終わらせず、教科書とワークシートを使って行動に移すことで結果につながります。</p><p>迷ったときは、この診断結果と現状把握シートを見返してください。</p><div class="mini-action">今日やることから始める</div></div><div class="btns no-print"><button class="primary" type="button" onclick="window.print()">診断結果をPDF保存/印刷する</button><button class="secondary" type="button" onclick="window.scrollTo({top:0,behavior:'smooth'})">最初に戻る</button></div>`;results.scrollIntoView({behavior:'smooth'})}
prevBtn.onclick=()=>{if(cur>0){cur--;render();diagnosisForm.scrollIntoView({behavior:'smooth'})}};nextBtn.onclick=()=>{if(cur<Q.length-1){cur++;render();diagnosisForm.scrollIntoView({behavior:'smooth'})}};diagnoseBtn.onclick=diagnose;resetBtn.onclick=()=>{cur=0;R=Array(Q.length).fill(0);results.classList.add('hidden');results.innerHTML='';['age','height','weight'].forEach(id=>document.getElementById(id).value='');render();scrollTo({top:0,behavior:'smooth'})};render();
</script></body></html>
