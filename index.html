<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Life Compass｜ダイエットロードマップ診断</title>
  <style>
    :root{
      --ivory:#fbf7ef;
      --white:#fffdf9;
      --pink:#d88993;
      --pink-soft:#f6e5e4;
      --gold:#c6a15b;
      --brown:#3d2a20;
      --line:#e5cfa5;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
      color:var(--brown);
      background:
        radial-gradient(circle at 20% 0%, rgba(255,255,255,.95), transparent 35%),
        linear-gradient(135deg,#fffdf8 0%,#fbf3e8 48%,#fffaf2 100%);
    }
    body:before{
      content:"";
      position:fixed; inset:0; pointer-events:none;
      background-image:
        linear-gradient(120deg, rgba(198,161,91,.08) 1px, transparent 1px),
        linear-gradient(40deg, rgba(216,137,147,.06) 1px, transparent 1px);
      background-size:160px 160px, 220px 220px;
    }
    .app{max-width:860px;margin:0 auto;padding:28px 16px 44px}
    .card{
      position:relative;
      background:rgba(255,253,249,.9);
      border:1px solid var(--line);
      border-radius:28px;
      padding:28px;
      box-shadow:0 18px 50px rgba(93,65,38,.10);
      overflow:hidden;
    }
    .card:before{
      content:"";
      position:absolute; inset:10px;
      border:1px solid rgba(198,161,91,.35);
      border-radius:22px;
      pointer-events:none;
    }
    .hero{text-align:center;padding:48px 24px}
    .brand{
      font-family:Georgia,serif;
      letter-spacing:.12em;
      color:var(--gold);
      margin:0 0 10px;
    }
    .badge{
      display:inline-block;
      border:1px solid var(--line);
      color:#8b6a37;
      padding:8px 18px;
      border-radius:999px;
      background:rgba(255,255,255,.65);
      margin:6px 0 18px;
    }
    h1,h2{
      font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
      font-weight:500;
      line-height:1.25;
      margin:0;
    }
    h1{font-size:clamp(34px,7vw,72px)}
    h1 span{color:var(--pink)}
    h2{font-size:clamp(26px,5vw,44px);text-align:center;margin-bottom:24px}
    .lead{font-size:20px;line-height:1.8;margin:24px auto;max-width:620px}
    .features{
      display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
      margin:26px auto;max-width:650px;
    }
    .features span{
      border:1px solid rgba(198,161,91,.35);
      border-radius:16px;padding:12px 8px;background:rgba(246,229,228,.35);
    }
    button{
      border:none;border-radius:999px;padding:16px 24px;
      font-weight:700;font-size:16px;cursor:pointer;
    }
    .primary{
      color:white;
      background:linear-gradient(135deg,#d98993,#c47b83);
      box-shadow:0 8px 20px rgba(216,137,147,.28);
    }
    .secondary{
      color:var(--brown);
      background:#fff7ef;
      border:1px solid var(--line);
    }
    .note{font-size:14px;line-height:1.8;color:#6b5648;margin-top:24px}
    .hidden{display:none}
    .progress-wrap{margin-bottom:24px}
    .progress-text{text-align:right;color:#8a6f51;font-size:14px}
    .progress{
      height:10px;background:#f4e5d6;border-radius:999px;overflow:hidden;margin-top:8px;
    }
    #bar{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--pink));transition:.25s}
    #questionTitle{
      text-align:left;font-size:26px;margin-bottom:22px;
    }
    .answers{display:grid;gap:12px}
    .answer{
      display:flex;align-items:flex-start;gap:10px;
      padding:15px 16px;border:1px solid #ead8c1;border-radius:18px;
      background:#fffdf9;cursor:pointer;
    }
    .answer input{margin-top:3px;accent-color:var(--pink)}
    .answer.selected{border-color:var(--pink);background:#fff1f2}
    .nav{display:flex;justify-content:space-between;gap:12px;margin-top:26px}
    .nav button{flex:1}
    .result-box{
      border:1px solid var(--line);
      background:rgba(255,255,255,.72);
      border-radius:22px;
      padding:20px;
      margin:18px 0;
    }
    .rank{
      display:inline-block;
      color:white;background:var(--pink);
      border-radius:999px;padding:6px 14px;font-weight:700;margin-bottom:8px;
    }
    .result-box h3{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:26px;margin:4px 0 12px}
    .result-box p{line-height:1.9}
    .result-box ul{line-height:2;padding-left:1.2em}
    .roadmap{
      display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px;
    }
    .month{background:#fff7f2;border:1px solid #ead8c1;border-radius:16px;padding:14px;line-height:1.7}
    @media(max-width:640px){
      .app{padding:16px 10px 32px}
      .card{padding:22px 16px;border-radius:22px}
      .hero{padding:38px 16px}
      .features,.roadmap{grid-template-columns:1fr}
      h1{font-size:42px}
      .lead{font-size:17px}
    }
    @media print{
      body{background:white}
      #restartBtn,#printBtn{display:none}
      .card{box-shadow:none;border:none}
    }
  
    /* ===== Mobile / responsive final fix ===== */
    .answers{
      display:grid;
      grid-template-columns:1fr;
      gap:12px;
      width:100%;
    }
    .answer{
      width:100%;
      min-width:0;
      display:flex;
      align-items:center;
      justify-content:flex-start;
      gap:12px;
      white-space:normal;
      word-break:keep-all;
      overflow-wrap:break-word;
      writing-mode:horizontal-tb;
      line-break:strict;
    }
    .answer span{
      display:block;
      min-width:0;
      flex:1 1 auto;
      white-space:normal;
      word-break:keep-all;
      overflow-wrap:break-word;
      writing-mode:horizontal-tb;
      line-height:1.65;
    }
    .answer input[type="radio"],
    .answer input[type="checkbox"]{
      width:22px !important;
      height:22px !important;
      min-width:22px !important;
      flex:0 0 22px !important;
      padding:0 !important;
      margin:0 !important;
      accent-color:var(--pink);
    }
    .answer input[type="number"]{
      width:100%;
      min-width:0;
    }
    #questionTitle{
      word-break:keep-all;
      overflow-wrap:break-word;
      line-break:strict;
      font-size:clamp(20px, 5.2vw, 26px);
    }
    .question-card,.card,.result-box{
      max-width:100%;
      overflow:hidden;
    }
    @media(max-width:759px){
      .app{padding:18px 12px 40px;}
      .card{padding:18px 16px;border-radius:24px;}
      h1{font-size:30px;line-height:1.45;}
      .subtitle{font-size:14px;}
      .answer{padding:13px 14px;font-size:15px;}
      .nav{flex-direction:column;}
      .nav button{width:100%;}
      .features,.roadmap{grid-template-columns:1fr !important;}
    }

  
    /* ===== Print only diagnosis result ===== */
    @media print{
      body{background:white!important;}
      body *{visibility:hidden!important;}
      #results, #results *{visibility:visible!important;}
      #results{
        position:absolute!important;
        left:0!important;
        top:0!important;
        width:100%!important;
        box-shadow:none!important;
        border:none!important;
        background:white!important;
      }
      #results:after{display:none!important;}
      .no-print{display:none!important;}
    }

    /* ===== One question per screen adjustments ===== */
    .single-question-mode .question{
      display:none;
    }
    .single-question-mode .question.current-question{
      display:block;
      animation:fade .25s ease;
    }
    .question-count{
      color:var(--muted);
      font-size:13px;
      font-weight:800;
      margin-bottom:10px;
      text-align:center;
    }
    .question-current-title{
      text-align:center;
      margin:10px 0 16px;
    }
    .single-question-mode .options{
      grid-template-columns:1fr!important;
      max-width:520px;
      margin:0 auto;
    }
    .single-question-mode .option{
      min-height:58px;
      font-size:16px;
      justify-content:flex-start;
    }
    .single-nav{
      display:flex;
      justify-content:center;
      gap:10px;
      margin-top:18px;
      flex-wrap:wrap;
    }

  </style>
</head>
<body>
  <main class="app">
    <section id="start" class="card hero">
      <p class="brand">Life Compass</p>
      <p class="badge">教科書購入者限定特典</p>
      <h1>あなた専用<br><span>ダイエットロードマップ診断</span></h1>
      <p class="lead">今のあなたが、最初に取り組むべきことがわかる。</p>
      <div class="features">
        <span>現在地分析</span>
        <span>優先順位TOP3</span>
        <span>90日ロードマップ</span>
      </div>
      <button id="startBtn" class="primary">診断をスタートする</button>
      <p class="note">「何をやるか」よりも「何からやるか」。あなたに合う順番を見つけましょう。</p>
    </section>

    <section id="quiz" class="card hidden">
      <div class="progress-wrap">
        <div class="progress-text"><span id="qCount"></span></div>
        <div class="progress"><div id="bar"></div></div>
      </div>
      <h2 id="questionTitle"></h2>
      <div id="questionBody" class="answers"></div>
      <div class="nav">
        <button id="backBtn" class="secondary">戻る</button>
        <button id="nextBtn" class="primary">次へ</button>
      </div>
    </section>

    <section id="result" class="card hidden">
      <p class="brand">Life Compass</p>
      <h2>あなた専用<br>ダイエットロードマップ</h2>
      <div id="resultContent"></div>
      <button id="restartBtn" class="secondary">もう一度診断する</button>
      <button id="printBtn" class="primary">PDF保存・印刷する</button>
    </section>
  </main>

  <script>
    const categories = [
      "食事量改善","栄養バランス改善","活動量UP","ボディメイク",
      "睡眠改善","ストレスケア","環境づくり","継続の工夫"
    ];

    const questions = [
      {id:"age", title:"年齢を選んでください", type:"single", options:["18歳未満","18〜29歳","30〜39歳","40〜49歳","50歳以上"], score:{}},
      {id:"height", title:"身長を入力してください", type:"number", unit:"cm", score:{}},
      {id:"weight", title:"現在の体重を入力してください", type:"number", unit:"kg", score:{}},
      {id:"goalWeight", title:"目標体重を入力してください", type:"number", unit:"kg", score:{}},
      {id:"goal", title:"今一番叶えたいことは？", type:"single", options:["体重を落としたい","見た目を変えたい","健康になりたい","リバウンドしない身体を作りたい","まだ分からない"], score:{}},
      {id:"worry", title:"今一番悩んでいることは？（最大2つ）", type:"multi", max:2, options:["体重","体脂肪","下腹","下半身","姿勢","肩こり・腰痛","リバウンド","健康"], score:{
        "下腹":{"ボディメイク":6},"下半身":{"ボディメイク":6},"姿勢":{"ボディメイク":7},"肩こり・腰痛":{"ボディメイク":5},"リバウンド":{"継続の工夫":6}
      }},
      {id:"state", title:"今の自分に一番近いものは？", type:"single", options:["何から始めたらいいか分からない","頑張っているのに痩せない","続かない","リバウンドを繰り返している","体重より見た目を変えたい"], score:{
        "何から始めたらいいか分からない":{"継続の工夫":6},
        "頑張っているのに痩せない":{"栄養バランス改善":4,"活動量UP":4},
        "続かない":{"継続の工夫":8},
        "リバウンドを繰り返している":{"継続の工夫":8,"食事量改善":3},
        "体重より見た目を変えたい":{"ボディメイク":8}
      }},
      {id:"full", title:"満腹になるまで食べることが多いですか？", type:"single", options:["毎回","よくある","時々","ほとんどない"], score:{
        "毎回":{"食事量改善":10},"よくある":{"食事量改善":8},"時々":{"食事量改善":4}
      }},
      {id:"notHungry", title:"空腹ではないのに食べることがありますか？", type:"single", options:["よくある","時々","ほとんどない"], score:{
        "よくある":{"食事量改善":8,"ストレスケア":2},"時々":{"食事量改善":4,"ストレスケア":1}
      }},
      {id:"snack", title:"間食はどのくらいしますか？", type:"single", options:["1日2回以上","1日1回","週2〜3回","ほとんどしない"], score:{
        "1日2回以上":{"食事量改善":10},"1日1回":{"食事量改善":6},"週2〜3回":{"食事量改善":3}
      }},
      {id:"drink", title:"甘い飲み物を飲みますか？", type:"single", options:["毎日","週3〜5回","週1〜2回","ほとんど飲まない"], score:{
        "毎日":{"食事量改善":8},"週3〜5回":{"食事量改善":5},"週1〜2回":{"食事量改善":2}
      }},
      {id:"night", title:"夜21時以降に食事をすることがありますか？", type:"single", options:["ほぼ毎日","週3〜5回","週1〜2回","ほとんどない"], score:{
        "ほぼ毎日":{"食事量改善":6,"環境づくり":3},"週3〜5回":{"食事量改善":4,"環境づくり":2},"週1〜2回":{"食事量改善":2}
      }},
      {id:"speed", title:"食べるスピードは？", type:"single", options:["10分以内","10〜20分","20分以上"], score:{
        "10分以内":{"食事量改善":6},"10〜20分":{"食事量改善":2}
      }},
      {id:"protein", title:"毎食たんぱく質を食べていますか？", type:"single", options:["ほとんど食べない","1食だけ","2食","3食"], score:{
        "ほとんど食べない":{"栄養バランス改善":10},"1食だけ":{"栄養バランス改善":6},"2食":{"栄養バランス改善":2}
      }},
      {id:"vege", title:"野菜・きのこ・海藻類を食べていますか？", type:"single", options:["ほとんど食べない","1食だけ","2食","3食以上"], score:{
        "ほとんど食べない":{"栄養バランス改善":8},"1食だけ":{"栄養バランス改善":5},"2食":{"栄養バランス改善":2}
      }},
      {id:"water", title:"水分は1日どのくらい飲みますか？", type:"single", options:["1L未満","1〜1.5L","1.5L以上"], score:{
        "1L未満":{"栄養バランス改善":6},"1〜1.5L":{"栄養バランス改善":3}
      }},
      {id:"breakfast", title:"朝食を食べていますか？", type:"single", options:["ほとんど食べない","食べたり食べなかったり","毎日食べる"], score:{
        "ほとんど食べない":{"栄養バランス改善":5,"環境づくり":2},"食べたり食べなかったり":{"栄養バランス改善":3}
      }},
      {id:"outside", title:"外食・コンビニを利用する頻度は？", type:"single", options:["ほぼ毎日","週3〜5回","週1〜2回","ほとんどない"], score:{
        "ほぼ毎日":{"環境づくり":6,"栄養バランス改善":4},"週3〜5回":{"環境づくり":4,"栄養バランス改善":2}
      }},
      {id:"steps", title:"平均歩数はどのくらいですか？", type:"single", options:["1000歩未満","3000歩未満","5000歩未満","8000歩以上"], score:{
        "1000歩未満":{"活動量UP":10},"3000歩未満":{"活動量UP":8},"5000歩未満":{"活動量UP":5}
      }},
      {id:"work", title:"仕事や日中の過ごし方は？", type:"single", options:["座っている時間が長い","立ち仕事が多い","半々くらい","よく動く"], score:{
        "座っている時間が長い":{"活動量UP":6},"半々くらい":{"活動量UP":2}
      }},
      {id:"exerciseReason", title:"運動できない理由に近いものは？", type:"single", options:["時間がない","苦手","続かない","何をしたらいいか分からない","必要性を感じない"], score:{
        "時間がない":{"活動量UP":4,"環境づくり":6},
        "苦手":{"活動量UP":6,"継続の工夫":3},
        "続かない":{"活動量UP":4,"継続の工夫":6},
        "何をしたらいいか分からない":{"活動量UP":5,"継続の工夫":5},
        "必要性を感じない":{"活動量UP":3}
      }},
      {id:"bodySatisfaction", title:"現在の体重には満足していますか？", type:"single", options:["満足","少し不満","かなり不満"], score:{
        "少し不満":{"食事量改善":3},"かなり不満":{"食事量改善":6}
      }},
      {id:"parts", title:"見た目で気になる部位は？（最大3つ）", type:"multi", max:3, options:["下腹","下半身","お尻","二の腕","背中","姿勢","顔"], score:{
        "下腹":{"ボディメイク":7},"下半身":{"ボディメイク":7},"お尻":{"ボディメイク":6},"二の腕":{"ボディメイク":5},"背中":{"ボディメイク":5},"姿勢":{"ボディメイク":7},"顔":{"食事量改善":2}
      }},
      {id:"posture", title:"姿勢で気になることは？", type:"multi", max:3, options:["反り腰","猫背","巻き肩","ストレートネック","分からない","特になし"], score:{
        "反り腰":{"ボディメイク":8},"猫背":{"ボディメイク":6},"巻き肩":{"ボディメイク":6},"ストレートネック":{"ボディメイク":5},"分からない":{"ボディメイク":2}
      }},
      {id:"condition", title:"身体の不調はありますか？", type:"multi", max:3, options:["肩こり","腰痛","むくみ","冷え","特になし"], score:{
        "肩こり":{"ボディメイク":4,"ストレスケア":2},"腰痛":{"ボディメイク":5},"むくみ":{"活動量UP":3,"栄養バランス改善":2},"冷え":{"活動量UP":2,"栄養バランス改善":2}
      }},
      {id:"sleep", title:"平均睡眠時間は？", type:"single", options:["5時間未満","5〜6時間","6〜7時間","7時間以上"], score:{
        "5時間未満":{"睡眠改善":10},"5〜6時間":{"睡眠改善":6},"6〜7時間":{"睡眠改善":3}
      }},
      {id:"sleepReason", title:"睡眠不足の理由に近いものは？", type:"single", options:["仕事","育児","スマホ","夜更かし","その他"], score:{
        "仕事":{"睡眠改善":6,"環境づくり":6},
        "育児":{"睡眠改善":6,"環境づくり":8,"ストレスケア":2},
        "スマホ":{"睡眠改善":8,"継続の工夫":2},
        "夜更かし":{"睡眠改善":8,"継続の工夫":2},
        "その他":{"睡眠改善":4}
      }},
      {id:"stressEat", title:"ストレスで食べてしまうことがありますか？", type:"single", options:["よくある","時々","ほとんどない"], score:{
        "よくある":{"ストレスケア":8,"食事量改善":4},"時々":{"ストレスケア":4,"食事量改善":2}
      }},
      {id:"stress", title:"最近ストレスを感じていますか？", type:"single", options:["強く感じる","少し感じる","あまり感じない"], score:{
        "強く感じる":{"ストレスケア":8},"少し感じる":{"ストレスケア":4}
      }},
      {id:"relax", title:"リラックスできる時間はありますか？", type:"single", options:["ほとんどない","少しある","十分ある"], score:{
        "ほとんどない":{"ストレスケア":7,"環境づくり":3},"少しある":{"ストレスケア":3}
      }},
      {id:"familyMeal", title:"家族と別メニューは作れますか？", type:"single", options:["作れない","時々ならできる","作れる","一人暮らし"], score:{
        "作れない":{"環境づくり":8},"時々ならできる":{"環境づくり":4}
      }},
      {id:"freeTime", title:"自由に使える時間はどのくらいありますか？", type:"single", options:["30分未満","30〜60分","1時間以上"], score:{
        "30分未満":{"環境づくり":8},"30〜60分":{"環境づくり":4}
      }},
      {id:"busy", title:"今の生活で一番忙しい理由は？", type:"single", options:["仕事","育児","介護","家事","その他"], score:{
        "仕事":{"環境づくり":6},"育児":{"環境づくり":8,"ストレスケア":2},"介護":{"環境づくり":8,"ストレスケア":3},"家事":{"環境づくり":5}
      }},
      {id:"fail", title:"ダイエットが続かなかった一番の理由は？", type:"single", options:["時間がなかった","モチベーションが続かなかった","我慢できなかった","結果が出なかった","方法が分からなかった"], score:{
        "時間がなかった":{"環境づくり":6,"継続の工夫":4},
        "モチベーションが続かなかった":{"継続の工夫":8},
        "我慢できなかった":{"食事量改善":4,"継続の工夫":5},
        "結果が出なかった":{"継続の工夫":8},
        "方法が分からなかった":{"継続の工夫":6}
      }},
      {id:"support", title:"どんなサポートがあると続けられそうですか？", type:"single", options:["一人でコツコツ","仲間がほしい","記録したい","専門家に相談したい","分からない"], score:{
        "仲間がほしい":{"継続の工夫":4},
        "記録したい":{"継続の工夫":2},
        "専門家に相談したい":{"継続の工夫":3},
        "分からない":{"継続の工夫":5}
      }},
    ];

    const templates = {
      "食事量改善": {
        why:"食事量や間食、飲み物などから摂るエネルギーを少し整えることで、変化が出やすい状態です。まずは食事を大きく変えるより、量やタイミングを整えることから始めましょう。",
        actions:["食事記録を3日だけつける","腹八分目を意識する","甘い飲み物を1日1杯お茶や水に変える"],
        change:["体重の変化を感じやすくなる","食べ過ぎのクセに気づける","無理な制限をしなくて済む"],
        message:"全部変えようとしなくて大丈夫。まずは食事量を少し整えることから始めてみましょう。"
      },
      "栄養バランス改善": {
        why:"食事量を減らすことよりも、たんぱく質・野菜・水分などを整えることが優先です。栄養が整うと、満足感や身体づくりにもつながります。",
        actions:["毎食たんぱく質を1つ入れる","野菜・きのこ・海藻を1品追加する","水分をこまめに飲む"],
        change:["満足感が増えやすい","筋肉を守りながら痩せやすい","体調が整いやすい"],
        message:"減らすより、まず整える。栄養バランスを味方につけましょう。"
      },
      "活動量UP": {
        why:"今は激しい運動より、日常生活で動く量を増やすことが変化につながりやすい状態です。まずは歩く・立つ・階段を使うなど、小さな活動量から増やしましょう。",
        actions:["今より＋2000歩を目指す","30分に1回立ち上がる","近い距離は歩く"],
        change:["消費エネルギーが増える","むくみが改善しやすい","運動へのハードルが下がる"],
        message:"運動が苦手でも大丈夫。まずは“生活の中で動く”から始めましょう。"
      },
      "ボディメイク": {
        why:"体重を落とすことだけでなく、姿勢や筋肉を整えることで理想の見た目に近づきやすい状態です。",
        actions:["気になる部位の宅トレを週2回","ストレッチを5分","ピラティスや姿勢改善を取り入れる"],
        change:["シルエットが整いやすい","姿勢がきれいに見えやすい","体重以外の変化を感じやすい"],
        message:"体重だけが正解ではありません。見た目を整える身体づくりも大切なダイエットです。"
      },
      "睡眠改善": {
        why:"睡眠不足は食欲や疲労感にも影響します。時間を大きく増やせなくても、睡眠の質や生活リズムを整える工夫が大切です。",
        actions:["30分だけ早く寝る日を作る","寝る前のスマホ時間を短くする","朝日を浴びる"],
        change:["食欲が安定しやすい","疲れにくくなる","日中の活動量が上がりやすい"],
        message:"忙しくても、できる範囲で睡眠を整えることはダイエットの土台になります。"
      },
      "ストレスケア": {
        why:"ストレスは食欲の増加や睡眠の質の低下につながり、ダイエットにも影響を与えることがあります。まずは自分に合うストレス発散方法を見つけましょう。",
        actions:["ウォーキングや軽い運動をする","ヨガ・瞑想・深呼吸を試す","趣味やリラックス時間を作る"],
        change:["ストレス食いが減りやすい","睡眠が整いやすい","継続しやすくなる"],
        message:"頑張り続けるだけが正解ではありません。ストレスを上手に発散することも、健康的なダイエットの一部です。"
      },
      "環境づくり": {
        why:"今の生活では、気合いで頑張るよりも続けやすい環境を作ることが優先です。忙しい毎日でもできる仕組みに変えていきましょう。",
        actions:["朝食を固定化する","コンビニ・冷凍食品も活用する","家族と同じメニューで量を調整する"],
        change:["迷う時間が減る","忙しくても続けやすい","リバウンドしにくい仕組みができる"],
        message:"もっと頑張るより、続く仕組みを作ることが近道です。"
      },
      "継続の工夫": {
        why:"方法そのものより、続け方を整えることで成功しやすい状態です。完璧を目指さず、小さく続ける設計にしましょう。",
        actions:["今週やることを3つに絞る","できたことを記録する","完璧ではなく再開を目標にする"],
        change:["挫折しにくくなる","自己嫌悪が減る","習慣として続きやすい"],
        message:"続かないのは意志が弱いからではありません。続く仕組みに変えていきましょう。"
      }
    };

    let current = 0;
    let answers = {};

    const start = document.getElementById("start");
    const quiz = document.getElementById("quiz");
    const result = document.getElementById("result");
    const qTitle = document.getElementById("questionTitle");
    const qBody = document.getElementById("questionBody");
    const qCount = document.getElementById("qCount");
    const bar = document.getElementById("bar");

    document.getElementById("startBtn").addEventListener("click", () => {
      start.classList.add("hidden");
      quiz.classList.remove("hidden");
      renderQuestion();
    });
    document.getElementById("backBtn").addEventListener("click", () => {
      if(current > 0){ current--; renderQuestion(); }
    });
    document.getElementById("nextBtn").addEventListener("click", () => {
      const q = questions[current];
      if(answers[q.id] === undefined || answers[q.id] === "" || (Array.isArray(answers[q.id]) && answers[q.id].length === 0)){
        alert("回答を選択してください");
        return;
      }
      if(current < questions.length - 1){ current++; renderQuestion(); }
      else showResult();
    });
    document.getElementById("restartBtn").addEventListener("click", () => location.reload());
    document.getElementById("printBtn").addEventListener("click", () => window.print());

    function renderQuestion(){
      const q = questions[current];
      qTitle.textContent = q.title;
      qCount.textContent = `${current + 1} / ${questions.length}`;
      bar.style.width = `${((current + 1) / questions.length) * 100}%`;
      qBody.innerHTML = "";

      if(q.type === "number"){
        const wrap = document.createElement("label");
        wrap.className = "answer";
        wrap.innerHTML = `<input type="number" min="0" step="0.1" value="${answers[q.id] || ""}" placeholder="入力"> <span>${q.unit || ""}</span>`;
        const input = wrap.querySelector("input");
        input.addEventListener("input", e => answers[q.id] = e.target.value);
        qBody.appendChild(wrap);
        return;
      }

      q.options.forEach(opt => {
        const label = document.createElement("label");
        label.className = "answer";
        const type = q.type === "multi" ? "checkbox" : "radio";
        const checked = q.type === "multi"
          ? (answers[q.id] || []).includes(opt)
          : answers[q.id] === opt;
        label.innerHTML = `<input type="${type}" name="${q.id}" ${checked ? "checked" : ""}> <span>${opt}</span>`;
        label.addEventListener("click", () => {
          if(q.type === "multi"){
            const arr = answers[q.id] || [];
            if(arr.includes(opt)) answers[q.id] = arr.filter(x => x !== opt);
            else {
              if(q.max && arr.length >= q.max){ alert(`最大${q.max}つまで選べます`); return; }
              answers[q.id] = [...arr, opt];
            }
          } else {
            answers[q.id] = opt;
          }
          renderQuestion();
        });
        if(checked) label.classList.add("selected");
        qBody.appendChild(label);
      });
    }

    function calcScores(){
      const scores = Object.fromEntries(categories.map(c => [c,0]));
      questions.forEach(q => {
        const ans = answers[q.id];
        if(!ans || !q.score) return;
        const vals = Array.isArray(ans) ? ans : [ans];
        vals.forEach(v => {
          const add = q.score[v];
          if(add) Object.entries(add).forEach(([cat, pts]) => scores[cat] += pts);
        });
      });
      return scores;
    }

    function getPhase(){
      const h = parseFloat(answers.height);
      const w = parseFloat(answers.weight);
      const bmi = h ? w / Math.pow(h/100, 2) : null;
      const goal = answers.goal;
      const bodySat = answers.bodySatisfaction;
      const parts = answers.parts || [];

      if(bmi && bmi < 18.5){
        return {name:"健康優先期", icon:"🤍", text:"現在は減量よりも、栄養バランスや健康的な身体づくりを優先しましょう。"};
      }
      if(goal === "体重を落としたい" || bodySat === "かなり不満" || bodySat === "少し不満"){
        return {name:"減量期", icon:"🌱", text:"現在は体重を落とすことを優先すると、変化を感じやすい時期です。"};
      }
      if(goal === "見た目を変えたい" || parts.length > 0){
        return {name:"ボディメイク期", icon:"💪", text:"現在は体重だけでなく、姿勢や筋肉を整えることで理想の見た目に近づきやすい時期です。"};
      }
      return {name:"維持・習慣化期", icon:"🤍", text:"現在はリバウンドを防ぎながら、健康的な習慣を続けることが大切な時期です。"};
    }

    function fastingCandidate(){
      return (answers.freeTime === "30分未満" || answers.fail === "結果が出なかった" || answers.fail === "時間がなかった");
    }

    function showResult(){
      quiz.classList.add("hidden");
      result.classList.remove("hidden");

      const scores = calcScores();
      const top = Object.entries(scores).sort((a,b) => b[1]-a[1]).slice(0,3);
      const phase = getPhase();
      let html = `
        <div class="result-box">
          <span class="rank">${phase.icon} あなたの現在地</span>
          <h3>${phase.name}</h3>
          <p>${phase.text}</p>
        </div>
        <h2>今のあなたが取り組む順番</h2>
      `;
      const ranks = ["🥇第1優先","🥈第2優先","🥉第3優先"];
      top.forEach(([cat], i) => {
        const t = templates[cat];
        html += `
          <div class="result-box">
            <span class="rank">${ranks[i]}</span>
            <h3>${cat}</h3>
            <p><strong>なぜ？</strong><br>${t.why}</p>
            <p><strong>今日からやること</strong></p>
            <ul>${t.actions.map(x => `<li>${x}</li>`).join("")}</ul>
            <p><strong>期待できる変化</strong></p>
            <ul>${t.change.map(x => `<li>${x}</li>`).join("")}</ul>
            <p>${t.message}</p>
          </div>
        `;
      });

      if(fastingCandidate()){
        html += `
          <div class="result-box">
            <span class="rank">⭐ 条件付きで検討</span>
            <h3>ファスティング</h3>
            <p>あなたには、短期間で生活をリセットする方法も選択肢の一つになるかもしれません。興味があれば、正しい方法を学んだ上で検討してみましょう。</p>
            <p class="note">※妊娠中・授乳中・持病がある方、体調に不安がある方は推奨しません。必要に応じて医師や専門家に相談してください。</p>
          </div>
        `;
      }

      html += `
        <div class="result-box">
          <span class="rank">90日ロードマップ</span>
          <div class="roadmap">
            <div class="month"><strong>1ヶ月目</strong><br>${top[0][0]}に集中</div>
            <div class="month"><strong>2ヶ月目</strong><br>${top[1][0]}を追加</div>
            <div class="month"><strong>3ヶ月目</strong><br>${top[2][0]}を追加</div>
          </div>
        </div>
        <div class="result-box">
          <h3>最後に</h3>
          <p>完璧を目指さなくて大丈夫。今日の診断結果は「今のあなた」に合ったスタート地点です。ライフスタイルが変われば、合う方法も変わります。迷った時は、またLife Compassに戻ってきてください。</p>
        </div>
      `;

      document.getElementById("resultContent").innerHTML = html;
      window.scrollTo({top:0, behavior:"smooth"});
    }
  </script>
